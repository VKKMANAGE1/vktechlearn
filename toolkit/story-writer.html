<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Story Writer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Set font to Inter */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937; /* bg-gray-800 */
        }

        ::-webkit-scrollbar-thumb {
            background-color: #4b5563; /* bg-gray-600 */
            border-radius: 6px;
            border: 3px solid #1f2937;
        }

        /* Loading spinner animation */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<meta name='google-adsense-platform-account' content='ca-host-pub-1556223355139109'/>
<meta name='google-adsense-platform-domain' content='blogspot.com'/>
</head>
<!-- Updated background with a subtle gradient for a more colorful look -->
<body class="bg-gradient-to-br from-gray-900 via-gray-900 to-indigo-950 text-gray-100 p-4 min-h-screen flex flex-col items-center">

    <!-- Main Container -->
    <div class="bg-gray-800 p-8 md:p-12 rounded-2xl shadow-2xl w-full max-w-7xl mx-auto">

        <!-- Header -->
        <header class="w-full flex flex-col items-center mb-8">
            <h1 class="text-4xl md:text-5xl font-extrabold text-white text-center tracking-tight">
                <i class="fas fa-book-reader text-blue-400 mr-3"></i>AI Story Writer
            </h1>
            <p class="text-gray-400 text-center mt-2 max-w-2xl">
                Enter a prompt and let AI create a story for you.
            </p>
        </header>
        
        <!-- Ad Banner Container -->
        <!-- Placed between the header and the input form for optimal visibility. -->
        <div class="my-8 w-full max-w-[728px] mx-auto">
            <div id="ad-container" class="rounded-lg overflow-hidden">
                <script type="text/javascript">
                    atOptions = {
                        'key' : '83485c03c484d846290caec013074aec',
                        'format' : 'iframe',
                        'height' : 90,
                        'width' : 728,
                        'params' : {}
                    };
                </script>
                <script type="text/javascript" src="//www.highperformanceformat.com/83485c03c484d846290caec013074aec/invoke.js"></script>
            </div>
        </div>

        <!-- Input Form -->
        <div class="w-full mb-8">
            <label for="promptText" class="text-xl font-semibold mb-3 text-gray-300">Story Prompt</label>
            <textarea id="promptText"
                      class="w-full h-32 bg-gray-700 text-gray-200 border border-gray-600 rounded-xl p-4 resize-y transition duration-300 ease-in-out focus:ring-2 focus:ring-blue-500 focus:outline-none placeholder-gray-500 text-base"
                      placeholder="e.g., A young detective discovers a secret society in an old library..."></textarea>
            
            <div class="mt-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                <!-- Genre Selector -->
                <div class="flex-1 w-full">
                    <label for="genreSelect" class="block text-sm font-medium text-gray-300 mb-1">Genre</label>
                    <select id="genreSelect" class="w-full p-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Sci-Fi">Sci-Fi</option>
                        <option value="Fantasy">Fantasy</option>
                        <option value="Mystery">Mystery</option>
                        <option value="Romance">Romance</option>
                        <option value="Horror">Horror</option>
                    </select>
                </div>

                <!-- Length Selector -->
                <div class="flex-1 w-full">
                    <label for="lengthSelect" class="block text-sm font-medium text-gray-300 mb-1">Length</label>
                    <select id="lengthSelect" class="w-full p-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="150">Short (150 words)</option>
                        <option value="300">Medium (300 words)</option>
                        <option value="500">Long (500 words)</option>
                    </select>
                </div>
            </div>
            
            <!-- Button -->
            <button id="writeButton" class="w-full mt-6 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-full shadow-lg transition duration-300 ease-in-out transform hover:scale-105">
                <i class="fas fa-magic mr-2"></i> Write Story
            </button>
        </div>

        <!-- Output Section -->
        <div id="outputSection" class="w-full relative mt-8">
            <label for="storyOutput" class="text-xl font-semibold mb-3 text-gray-300">Generated Story</label>
            <div id="storyOutput"
                 class="w-full h-96 bg-gray-700 text-gray-200 border border-gray-600 rounded-xl p-6 overflow-y-auto transition duration-300 ease-in-out text-base leading-relaxed">
                Your generated story will appear here.
            </div>

            <!-- Output Buttons -->
            <div class="absolute bottom-4 right-4 flex space-x-2">
                <button id="copyButton" class="bg-gray-600 hover:bg-gray-500 text-white p-2 rounded-full transition duration-200 ease-in-out shadow-md">
                    <i class="fas fa-copy"></i>
                </button>
                <button id="downloadButton" class="bg-gray-600 hover:bg-gray-500 text-white p-2 rounded-full transition duration-200 ease-in-out shadow-md">
                    <i class="fas fa-download"></i>
                </button>
            </div>
        </div>
        
        <!-- Error/Message Area -->
        <div id="messageArea" class="mt-8 text-center text-sm font-medium w-full max-w-2xl hidden"></div>
    </div>

    <script>
        // DOM Element references
        const promptText = document.getElementById('promptText');
        const genreSelect = document.getElementById('genreSelect');
        const lengthSelect = document.getElementById('lengthSelect');
        const writeButton = document.getElementById('writeButton');
        const storyOutput = document.getElementById('storyOutput');
        const copyButton = document.getElementById('copyButton');
        const downloadButton = document.getElementById('downloadButton');
        const messageArea = document.getElementById('messageArea');

        // --- Utility Functions ---

        // Show a temporary message to the user
        const showMessage = (message, isError = false) => {
            messageArea.innerText = message;
            messageArea.className = `mt-8 text-center text-sm font-medium w-full max-w-2xl block rounded-md p-3 transition-opacity duration-500 ease-in-out ${isError ? 'bg-red-800 text-red-200' : 'bg-green-800 text-green-200'}`;
            messageArea.style.opacity = '1';
            setTimeout(() => {
                messageArea.style.opacity = '0';
                messageArea.addEventListener('transitionend', (e) => {
                    if (e.propertyName === 'opacity' && messageArea.style.opacity === '0') {
                        messageArea.classList.add('hidden');
                    }
                }, { once: true });
            }, 3000);
        };

        // --- Event Handlers ---

        // Handle the "Write Story" button click
        writeButton.addEventListener('click', async () => {
            const userPrompt = promptText.value.trim();
            if (!userPrompt) {
                showMessage("Please enter a story prompt.", true);
                return;
            }

            const genre = genreSelect.value;
            const length = lengthSelect.value;

            // Show loading state
            writeButton.innerHTML = `<div class="loader"></div><span class="ml-2">Writing...</span>`;
            writeButton.disabled = true;
            storyOutput.innerHTML = '';
            
            // Construct the prompt for the AI
            const prompt = `Write a short story in the ${genre} genre, approximately ${length} words long. The story should be based on the following prompt: ${userPrompt}`;
            
            // Gemini API call configuration
            const apiKey = "AIzaSyB3Nb0mlF1HTe1CP8pvhK7wgYGI8FgC_yA"; // API key will be provided by the environment
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{
                    parts: [{ text: prompt }]
                }]
            };

            let success = false;
            let retryCount = 0;
            const maxRetries = 3;
            const baseDelay = 1000; // 1 second

            while (!success && retryCount < maxRetries) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if (response.status === 429) {
                            // Rate limit exceeded, retry with exponential backoff
                            const delay = baseDelay * Math.pow(2, retryCount);
                            console.warn(`Rate limit exceeded. Retrying in ${delay}ms...`);
                            await new Promise(res => setTimeout(res, delay));
                            retryCount++;
                            continue;
                        } else {
                            // Other HTTP error
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                    }

                    const result = await response.json();
                    
                    if (result.candidates && result.candidates.length > 0 &&
                        result.candidates[0].content && result.candidates[0].content.parts &&
                        result.candidates[0].content.parts.length > 0) {
                        
                        const generatedStory = result.candidates[0].content.parts[0].text;
                        storyOutput.innerText = generatedStory;
                        success = true;
                        showMessage("Story generated successfully!", false);
                    } else {
                        throw new Error("Invalid response format from API.");
                    }
                } catch (error) {
                    console.error("Error fetching data from Gemini API:", error);
                    // If it's not a rate limit error, break the retry loop
                    if (error.message.indexOf('429') === -1) {
                            showMessage("An error occurred. Please try again.", true);
                            break;
                    }
                }
            }
            
            // Reset button state
            writeButton.innerHTML = `<i class="fas fa-magic mr-2"></i> Write Story`;
            writeButton.disabled = false;
        });

        // Handle the "Copy" button click
        copyButton.addEventListener('click', () => {
            const textToCopy = storyOutput.innerText;
            if (textToCopy && textToCopy !== "Your generated story will appear here.") {
                // Use the older document.execCommand('copy') for better iframe compatibility
                const tempTextarea = document.createElement('textarea');
                tempTextarea.value = textToCopy;
                document.body.appendChild(tempTextarea);
                tempTextarea.select();
                document.execCommand('copy');
                document.body.removeChild(tempTextarea);
                showMessage("Story copied to clipboard!", false);
            } else {
                showMessage("No story to copy.", true);
            }
        });

        // Handle the "Download as TXT" button click
        downloadButton.addEventListener('click', () => {
            const textToDownload = storyOutput.innerText;
            if (textToDownload && textToDownload !== "Your generated story will appear here.") {
                const blob = new Blob([textToDownload], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ai_story.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showMessage("Story downloaded as a TXT file.", false);
            } else {
                showMessage("Nothing to download.", true);
            }
        });
    </script>
</body>
</html>
