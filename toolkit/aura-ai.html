        .markdown-content ul, .markdown-content ol { margin-bottom: 1em; padding-left: 1.5em; }
        .markdown-content ul { list-style-type: disc; }
        .markdown-content ol { list-style-type: decimal; }

    <script>
        /* ------------------------------------------------------------------
           CONFIG
           ------------------------------------------------------------------
           PROXY_URL: (recommended for a public website)
             Deploy the included worker.js on Cloudflare Workers (free) with
             your Gemini key stored as a secret, then paste the worker URL
             here. Visitors then chat for free and your key stays hidden.
             Example: const PROXY_URL = 'https://aura-chat.yourname.workers.dev';

           Leave it empty to use the free Puter engine / visitor's own key.
           ------------------------------------------------------------------ */
        const PROXY_URL = '';
        const PUTER_MODEL = 'gpt-5-nano';
        const SYSTEM_PROMPT = 'You are Aura AI, a friendly and knowledgeable assistant. Answer clearly and use markdown when helpful. Reply in the same language the user writes in (including Hindi or Hinglish).';

        class AuraChatBot {
            constructor() {
                this.settings = this.loadSettings();
                this.conversations = this.loadConversations();
                this.currentChatId = null;
                this.currentMessages = [];
                this.isTyping = false;
                this.abortController = null;

                this.initElements();
                this.initEventListeners();
                this.applySettings();
                this.loadConversationHistory();
                this.newConversation();
            }

            /* ---------- storage ---------- */
            loadSettings() {
                const defaults = {
                    userName: '',
                    selectedModel: 'free',
                    apiKey: '',
                    theme: 'dark'
                };
                try {
                    const saved = JSON.parse(localStorage.getItem('ai_chat_settings') || 'null');
                    return saved ? { ...defaults, ...saved } : defaults;
                } catch (e) {
                    return defaults;
                }
            }

            loadConversations() {
                try {
                    return JSON.parse(localStorage.getItem('ai_conversations') || '{}') || {};
                } catch (e) {
                    return {};
                }
            }

            saveSettings() {
                localStorage.setItem('ai_chat_settings', JSON.stringify(this.settings));
            }

            saveConversations() {
                localStorage.setItem('ai_conversations', JSON.stringify(this.conversations));
            }

            /* ---------- wiring ---------- */
            initElements() {
                this.sidebar = document.getElementById('sidebar');
                this.sidebarOverlay = document.getElementById('sidebarOverlay');
                this.chatMessages = document.getElementById('chatMessages');
                this.chatContainer = document.getElementById('chatContainer');
                this.messageInput = document.getElementById('messageInput');
                this.sendBtn = document.getElementById('sendBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.sendIcon = document.getElementById('sendIcon');
                this.loadingIcon = document.getElementById('loadingIcon');
                this.chatTitle = document.getElementById('chatTitle');
                this.chatSubtitle = document.getElementById('chatSubtitle');
                this.chatHistory = document.getElementById('chatHistory');
                this.modelSelector = document.getElementById('modelSelector');
                this.apiKeyWrap = document.getElementById('apiKeyWrap');
                this.apiKeyInput = document.getElementById('apiKeyInput');
                this.newChatBtn = document.getElementById('newChatBtn');
                this.clearHistoryBtn = document.getElementById('clearHistoryBtn');
                this.themeToggle = document.getElementById('themeToggle');
                this.sidebarToggle = document.getElementById('sidebarToggle');
                this.welcomeTemplate = document.getElementById('welcomeTemplate');
            }

            initEventListeners() {
                this.sendBtn.addEventListener('click', () => this.sendMessage());
                this.stopBtn.addEventListener('click', () => this.abortController && this.abortController.abort());

                this.messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
                this.messageInput.addEventListener('input', () => this.autoResizeTextarea());

                document.addEventListener('click', (e) => {
                    const btn = e.target.closest('.suggestion-btn');
                    if (btn) {
                        this.messageInput.value = btn.dataset.suggestion;
                        this.autoResizeTextarea();
                        this.sendMessage();
                    }
                });

                this.newChatBtn.addEventListener('click', () => this.newConversation());
                this.sidebarToggle.addEventListener('click', () => this.toggleSidebar());
                this.sidebarOverlay.addEventListener('click', () => this.closeSidebar());
                this.clearHistoryBtn.addEventListener('click', () => this.clearAllHistory());
                this.themeToggle.addEventListener('click', () => this.toggleTheme());

                this.modelSelector.addEventListener('change', (e) => {
                    this.settings.selectedModel = e.target.value;
                    this.saveSettings();
                    this.applyModelUI();
                });

                this.apiKeyInput.addEventListener('input', (e) => {
                    this.settings.apiKey = e.target.value.trim();
                    this.saveSettings();
                });

                window.addEventListener('resize', () => this.applyResponsiveState());
            }

            autoResizeTextarea() {
                this.messageInput.style.height = 'auto';
                this.messageInput.style.height = Math.min(this.messageInput.scrollHeight, 128) + 'px';
            }

            applySettings() {
                document.documentElement.classList.toggle('dark', this.settings.theme === 'dark');
                this.modelSelector.value = this.settings.selectedModel;
                if (this.modelSelector.selectedIndex === -1) {
                    this.settings.selectedModel = 'free';
                    this.modelSelector.value = 'free';
                }
                this.apiKeyInput.value = this.settings.apiKey || '';
                this.applyModelUI();
                this.applyResponsiveState();
            }

            applyModelUI() {
                const isFree = this.settings.selectedModel === 'free';
                this.apiKeyWrap.classList.toggle('hidden', isFree);
                const labels = {
                    'free': PROXY_URL ? 'Aura Free engine (secure proxy)' : 'Aura Free engine (Puter)',
                    'gemini-2.0-flash': 'Gemini 2.0 Flash',
                    'gemini-2.5-flash': 'Gemini 2.5 Flash',
                    'gemini-1.5-flash': 'Gemini 1.5 Flash'
                };
                this.chatSubtitle.textContent = labels[this.settings.selectedModel] || 'Aura Free engine';

                const note = document.getElementById('engineNote');
                if (isFree) {
                    note.textContent = PROXY_URL
                        ? 'Free for everyone. Responses may be inaccurate.'
                        : 'Free engine powered by Puter — one-time free sign-in on first message.';
                } else {
                    note.textContent = 'Your API key stays in this browser only. Responses may be inaccurate.';
                }
            }

            applyResponsiveState() {
                if (window.innerWidth >= 1024) {
                    this.sidebar.classList.remove('-translate-x-full');
                    this.sidebarOverlay.classList.add('hidden');
                } else {
                    this.sidebar.classList.add('-translate-x-full');
                }
            }

            toggleSidebar() {
                this.sidebar.classList.toggle('-translate-x-full');
                this.sidebarOverlay.classList.toggle('hidden');
            }

            closeSidebar() {
                this.sidebar.classList.add('-translate-x-full');
                this.sidebarOverlay.classList.add('hidden');
            }

            toggleTheme() {
                const isDark = document.documentElement.classList.toggle('dark');
                this.settings.theme = isDark ? 'dark' : 'light';
                this.saveSettings();
            }

            showNotification(message, type = 'info') {
                const el = document.createElement('div');
                const bg = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
                el.className = `fixed top-4 right-4 ${bg} text-white px-6 py-3 rounded-xl shadow-lg z-50 message-fade-in transition-all duration-300`;
                el.textContent = message;
                document.body.appendChild(el);
                setTimeout(() => {
                    el.style.opacity = '0';
                    el.style.transform = 'translateY(-20px)';
                    setTimeout(() => el.remove(), 300);
                }, 3500);
            }

            /* ---------- conversation lifecycle ---------- */
            newConversation() {
                this.currentChatId = null;
                this.currentMessages = [];
                this.chatTitle.textContent = 'New Conversation';
                this.chatMessages.innerHTML = '';
                this.chatMessages.appendChild(this.welcomeTemplate.content.cloneNode(true));
                if (window.innerWidth >= 1024) this.messageInput.focus();
                if (window.innerWidth < 1024) this.closeSidebar();
            }

            hideWelcome() {
                const welcome = this.chatMessages.querySelector('[data-welcome]');
                if (welcome) welcome.remove();
            }

            async sendMessage() {
                const message = this.messageInput.value.trim();
                if (!message || this.isTyping) return;

                if (this.settings.selectedModel === 'free' && !PROXY_URL && typeof puter === 'undefined') {
                    this.showNotification('Free engine could not load. Check your internet connection.', 'error');
                    return;
                }

                if (this.settings.selectedModel !== 'free' && !this.settings.apiKey) {
                    this.showNotification('Please paste your Gemini API key, or switch to the free engine.', 'error');
                    return;
                }

                this.setBusy(true);
                this.hideWelcome();

                if (!this.currentChatId) {
                    this.currentChatId = Date.now().toString();
                    this.chatTitle.textContent = message.substring(0, 40) + (message.length > 40 ? '...' : '');
                }

                this.addMessage(message, 'user');
                this.currentMessages.push({ role: 'user', content: message });
                this.messageInput.value = '';
                this.autoResizeTextarea();
                this.scrollToBottom();

                const loadingId = this.addLoadingMessage();
                this.abortController = new AbortController();

                let target = null;
                let answer = '';
                const onChunk = (chunk) => {
                    if (!chunk) return;
                    if (!target) {
                        this.removeMessage(loadingId);
                        target = this.addMessage('', 'assistant');
                        target.classList.add('cursor-blink');
                    }
                    answer += chunk;
                    target.innerHTML = this.formatMarkdown(answer);
                    this.scrollToBottom();
                };

                try {
                    if (this.settings.selectedModel === 'free') {
                        answer = PROXY_URL
                            ? await this.callProxyAPI(onChunk)
                            : await this.callPuterAPI(onChunk);
                    } else {
                        answer = await this.callGeminiAPI(onChunk);
                    }

                    if (!answer.trim()) throw new Error('Empty response from the model');

                    this.removeMessage(loadingId);
                    if (target) {
                        target.classList.remove('cursor-blink');
                        target.innerHTML = this.formatMarkdown(answer);
                    } else {
                        this.addMessage(answer, 'assistant');
                    }
                    this.currentMessages.push({ role: 'assistant', content: answer });
                    this.saveCurrentConversation();
                } catch (error) {
                    this.removeMessage(loadingId);
                    if (error.name === 'AbortError') {
                        if (target) {
                            target.classList.remove('cursor-blink');
                            if (answer.trim()) {
                                this.currentMessages.push({ role: 'assistant', content: answer });
                                this.saveCurrentConversation();
                            }
                        }
                        this.showNotification('Generation stopped', 'info');
                    } else {
                        console.error('API Error:', error);
                        if (target) target.remove();
                        this.addMessage('Sorry, I could not get a response.\n\n`' + error.message + '`\n\nPlease check your internet connection and try again.', 'assistant', true);
                        this.showNotification('Failed to get AI response', 'error');
                    }
                } finally {
                    this.abortController = null;
                    this.setBusy(false);
                    this.scrollToBottom();
                }
            }

            setBusy(busy) {
                this.isTyping = busy;
                this.sendBtn.disabled = busy;
                this.sendIcon.classList.toggle('hidden', busy);
                this.loadingIcon.classList.toggle('hidden', !busy);
                this.stopBtn.classList.toggle('hidden', !busy);
                if (!busy && window.innerWidth >= 1024) this.messageInput.focus();
            }

            /* ---------- APIs ---------- */
            buildHistory(limit = 20) {
                return this.currentMessages.slice(-limit);
            }

            // Free engine #1: Puter.js — no API key for you, visitors sign in
            // once with a free Puter account ("user pays" model).
            async callPuterAPI(onChunk) {
                const messages = [
                    { role: 'system', content: SYSTEM_PROMPT },
                    ...this.buildHistory().map(m => ({ role: m.role, content: m.content }))
                ];

                const stream = await puter.ai.chat(messages, { model: PUTER_MODEL, stream: true });
                let full = '';
                for await (const part of stream) {
                    if (this.abortController.signal.aborted) {
                        const err = new Error('aborted');
                        err.name = 'AbortError';
                        throw err;
                    }
                    const piece = typeof part === 'string' ? part : (part && part.text) || '';
                    if (piece) {
                        full += piece;
                        onChunk(piece);
                    }
                }
                return full;
            }

            // Free engine #2: your own Cloudflare Worker proxy (key stays secret)
            // Free tiers answer "overloaded" now and then, so a request that
            // failed before producing any text is retried a couple of times.
            async callProxyAPI(onChunk) {
                let received = false;
                const track = (piece) => { received = true; onChunk(piece); };

                for (let attempt = 0; ; attempt++) {
                    try {
                        return await this.proxyAttempt(track);
                    } catch (error) {
                        const retriable = !received && attempt < 2 &&
                            error.name !== 'AbortError' &&
                            /overload|temporarily|50[234]/i.test(error.message || '');
                        if (!retriable) throw error;
                        await new Promise(r => setTimeout(r, 800 * (attempt + 1)));
                    }
                }
            }

            async proxyAttempt(onChunk) {
                const response = await fetch(PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system: SYSTEM_PROMPT,
                        messages: this.buildHistory()
                    }),
                    signal: this.abortController.signal
                });

                if (!response.ok) {
                    throw new Error(`Proxy error ${response.status}`);
                }

                // Accepts both OpenAI-style (NVIDIA NIM, OpenAI) and Gemini-style chunks
                return await this.readSSE(response, onChunk, (json) => {
                    if (json.error) {
                        const err = new Error(json.error.message || 'Upstream error');
                        err.isStream = true;
                        throw err;
                    }
                    const choice = json.choices && json.choices[0];
                    if (choice) {
                        const delta = choice.delta || choice.message || {};
                        return delta.content || '';
                    }
                    const cand = json.candidates && json.candidates[0];
                    const parts = cand && cand.content && cand.content.parts;
                    return parts ? parts.map(p => p.text || '').join('') : '';
                });
            }

            async callGeminiAPI(onChunk) {
                const model = this.settings.selectedModel;
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${encodeURIComponent(this.settings.apiKey)}`;

                const body = {
                    systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
                    contents: this.buildHistory().map(m => ({
                        role: m.role === 'user' ? 'user' : 'model',
                        parts: [{ text: m.content }]
                    })),
                    generationConfig: { temperature: 0.7, topP: 0.95, maxOutputTokens: 2048 }
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                    signal: this.abortController.signal
                });

                if (!response.ok) {
                    let detail = '';
                    try {
                        const err = await response.json();
                        detail = err.error && err.error.message ? `: ${err.error.message}` : '';
                    } catch (e) { /* ignore */ }
                    throw new Error(`Gemini API error ${response.status}${detail}`);
                }

                return await this.readSSE(response, onChunk, (json) => {
                    const cand = json.candidates && json.candidates[0];
                    const parts = cand && cand.content && cand.content.parts;
                    return parts ? parts.map(p => p.text || '').join('') : '';
                });
            }

            async readSSE(response, onChunk, extract) {
                const reader = response.body && response.body.getReader
                    ? response.body.getReader()
                    : null;

                if (!reader) {
                    // Fallback for browsers without streaming support
                    const text = await response.text();
                    let full = '';
                    text.split('\n').forEach(line => {
                        if (!line.startsWith('data:')) return;
                        const payload = line.slice(5).trim();
                        if (!payload || payload === '[DONE]') return;
                        try {
                            full += extract(JSON.parse(payload));
                        } catch (e) {
                            if (e && e.isStream) throw e;
                        }
                    });
                    onChunk(full);
                    return full;
                }

                const decoder = new TextDecoder();
                let buffer = '';
                let full = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed.startsWith('data:')) continue;
                        const payload = trimmed.slice(5).trim();
                        if (!payload || payload === '[DONE]') continue;
                        try {
                            const piece = extract(JSON.parse(payload));
                            if (piece) {
                                full += piece;
                                onChunk(piece);
                            }
                        } catch (e) {
                            if (e && e.isStream) throw e;
                            /* partial JSON, ignore */
                        }
                    }
                }
                return full;
            }

            /* ---------- rendering ---------- */
            addMessage(content, sender, isError = false) {
                const messageId = String(Date.now()) + Math.random().toString(16).slice(2);
                const row = document.createElement('div');
                row.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} message-fade-in`;
                row.setAttribute('data-message-id', messageId);

                const avatar = document.createElement('div');
                avatar.className = `w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center text-xs font-bold ${
                    sender === 'user'
                        ? 'bg-gradient-to-r from-purple-500 to-blue-500 text-white order-2 ml-3'
                        : 'bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 mr-3'
                }`;
                avatar.textContent = sender === 'user' ? ((this.settings.userName || 'U').charAt(0).toUpperCase()) : 'AI';

                const bubble = document.createElement('div');
                bubble.className = `max-w-2xl px-4 py-3 rounded-2xl chat-message ${
                    sender === 'user'
                        ? 'bg-gradient-to-r from-purple-500 to-blue-500 text-white'
                        : `bg-white dark:bg-premium-card text-gray-900 dark:text-gray-100 shadow-sm ${isError ? 'border-l-4 border-red-500' : ''}`
                }`;

                const body = document.createElement('div');
                body.className = 'message-content markdown-content';
                body.innerHTML = this.formatMarkdown(content);

                const timestamp = document.createElement('div');
                timestamp.className = `text-xs opacity-60 mt-2 ${sender === 'user' ? 'text-right' : 'text-left'}`;
                timestamp.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                bubble.appendChild(body);
                bubble.appendChild(timestamp);
                row.appendChild(avatar);
                row.appendChild(bubble);
                this.chatMessages.appendChild(row);

                return body;
            }

            addLoadingMessage() {
                const messageId = 'loading-' + Date.now();
                const row = document.createElement('div');
                row.className = 'flex justify-start message-fade-in';
                row.setAttribute('data-message-id', messageId);
                row.innerHTML = `
                    <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center text-xs font-bold bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 mr-3">AI</div>
                    <div class="px-4 py-3 rounded-2xl bg-white dark:bg-premium-card shadow-sm">
                        <div class="flex items-center gap-2">
                            <div class="typing-animation"></div>
                            <div class="typing-animation"></div>
                            <div class="typing-animation"></div>
                            <span class="ml-2 text-sm text-gray-500 dark:text-gray-400">Thinking...</span>
                        </div>
                    </div>`;
                this.chatMessages.appendChild(row);
                this.scrollToBottom();
                return messageId;
            }

            removeMessage(messageId) {
                const el = this.chatMessages.querySelector(`[data-message-id="${messageId}"]`);
                if (el) el.remove();
            }

            scrollToBottom() {
                this.chatContainer.scrollTop = this.chatContainer.scrollHeight;
            }

            escapeHtml(text) {
                return text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
            }

            formatMarkdown(text) {
                if (!text) return '';
                const blocks = [];
                let html = this.escapeHtml(text);

                // fenced code blocks (a fence still open mid-stream is closed here)
                if ((html.match(/```/g) || []).length % 2 === 1) {
                    html += '\n```';
                }
                html = html.replace(/```(\w+)?\n?([\s\S]*?)```/g, (m, lang, code) => {
                    blocks.push(`<pre><code>${code.replace(/\n$/, '')}</code></pre>`);
                    return `\u0000BLOCK${blocks.length - 1}\u0000`;
                });
                // inline code
                html = html.replace(/`([^`\n]+)`/g, (m, code) => {
                    blocks.push(`<code>${code}</code>`);
                    return `\u0000BLOCK${blocks.length - 1}\u0000`;
                });

                html = html
                    .replace(/^######\s+(.*)$/gm, '<h3>$1</h3>')
                    .replace(/^#####\s+(.*)$/gm, '<h3>$1</h3>')
                    .replace(/^####\s+(.*)$/gm, '<h3>$1</h3>')
                    .replace(/^###\s+(.*)$/gm, '<h3>$1</h3>')
                    .replace(/^##\s+(.*)$/gm, '<h2>$1</h2>')
                    .replace(/^#\s+(.*)$/gm, '<h1>$1</h1>')
                    .replace(/^\s*&gt;\s?(.*)$/gm, '<blockquote>$1</blockquote>')
                    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
                    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

                // lists
                const lines = html.split('\n');
                const out = [];
                let listType = null;
                const closeList = () => { if (listType) { out.push(`</${listType}>`); listType = null; } };

                for (const line of lines) {
                    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
                    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
                    if (ul) {
                        if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
                        out.push(`<li>${ul[1]}</li>`);
                    } else if (ol) {
                        if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
                        out.push(`<li>${ol[1]}</li>`);
                    } else {
                        closeList();
                        out.push(line);
                    }
                }
                closeList();
                html = out.join('\n');

                // paragraphs
                html = html
                    .split(/\n{2,}/)
                    .map(block => {
                        const t = block.trim();
                        if (!t) return '';
                        if (/^<(h1|h2|h3|ul|ol|pre|blockquote|table)/.test(t)) return t;
                        return `<p>${t.replace(/\n/g, '<br>')}</p>`;
                    })
                    .join('');

                return html.replace(/\u0000BLOCK(\d+)\u0000/g, (m, i) => blocks[Number(i)]);
            }

            /* ---------- history ---------- */
            saveCurrentConversation() {
                if (!this.currentChatId) return;
                this.conversations[this.currentChatId] = {
                    id: this.currentChatId,
                    title: this.chatTitle.textContent,
                    messages: [...this.currentMessages],
                    timestamp: new Date().toISOString(),
                    model: this.settings.selectedModel
                };
                this.saveConversations();
                this.loadConversationHistory();
            }

            loadConversationHistory() {
                this.chatHistory.innerHTML = '';
                const items = Object.values(this.conversations)
                    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                if (!items.length) {
                    const empty = document.createElement('div');
                    empty.className = 'text-center text-gray-500 dark:text-gray-400 text-sm py-8';
                    empty.innerHTML = `
                        <svg class="w-12 h-12 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                        </svg>
                        <p>No conversations yet</p>`;
                    this.chatHistory.appendChild(empty);
                    return;
                }

                items.forEach(conversation => {
                    const item = document.createElement('div');
                    item.className = 'group flex items-center gap-3 p-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-all duration-200 cursor-pointer premium-card';

                    const info = document.createElement('div');
                    info.className = 'flex-1 min-w-0';
                    const title = document.createElement('div');
                    title.className = 'font-medium text-sm truncate';
                    title.textContent = conversation.title;
                    const meta = document.createElement('div');
                    meta.className = 'text-xs text-gray-500 dark:text-gray-400 mt-1';
                    meta.textContent = `${new Date(conversation.timestamp).toLocaleDateString()} · ${conversation.messages.length} messages`;
                    info.appendChild(title);
                    info.appendChild(meta);

                    const del = document.createElement('button');
                    del.className = 'delete-chat opacity-0 group-hover:opacity-100 p-1 rounded-lg hover:bg-red-100 dark:hover:bg-red-900 text-red-500 transition-all';
                    del.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`;
                    del.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.deleteConversation(conversation.id);
                    });

                    item.appendChild(info);
                    item.appendChild(del);
                    item.addEventListener('click', () => this.loadConversation(conversation.id));
                    this.chatHistory.appendChild(item);
                });
            }

            loadConversation(chatId) {
                const conversation = this.conversations[chatId];
                if (!conversation) return;

                this.currentChatId = chatId;
                this.currentMessages = [...conversation.messages];
                this.chatTitle.textContent = conversation.title;
                this.chatMessages.innerHTML = '';
                conversation.messages.forEach(msg => {
                    this.addMessage(msg.content, msg.role === 'user' ? 'user' : 'assistant');
                });
                this.scrollToBottom();
                if (window.innerWidth < 1024) this.closeSidebar();
            }

            deleteConversation(chatId) {
                if (!confirm('Delete this conversation?')) return;
                delete this.conversations[chatId];
                this.saveConversations();
                if (this.currentChatId === chatId) this.newConversation();
                this.loadConversationHistory();
                this.showNotification('Conversation deleted', 'info');
            }

            clearAllHistory() {
                if (!confirm('Delete all conversation history?')) return;
                this.conversations = {};
                this.saveConversations();
                this.loadConversationHistory();
                this.newConversation();
                this.showNotification('All conversations deleted', 'info');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.chatBot = new AuraChatBot();
        });
    </script>
</body>
</html>
