<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Set font to Inter */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937; /* bg-gray-800 */
        }

        ::-webkit-scrollbar-thumb {
            background-color: #4b5563; /* bg-gray-600 */
            border-radius: 6px;
            border: 3px solid #1f2937;
        }

        /* Hide the number input spin buttons */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
<meta name='google-adsense-platform-account' content='ca-host-pub-1556223355139109'/>
<meta name='google-adsense-platform-domain' content='blogspot.com'/>
</head>
<body class="bg-gray-900 text-gray-100 p-4 min-h-screen flex items-center justify-center">

    <!-- Main Container -->
    <div class="bg-gray-800 p-8 md:p-12 rounded-2xl shadow-2xl w-full max-w-2xl mx-auto flex flex-col items-center">

        <!-- Header -->
        <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-6 md:mb-10 text-center tracking-tight">
            <i class="fas fa-money-bill-transfer text-blue-400 mr-3"></i>Currency Converter
        </h1>
        <p class="text-gray-400 text-center mb-8 max-w-2xl">
            Get the latest exchange rates and convert currencies in real time.
        </p>
        
        <!-- Ad Banner Container -->
        <!-- Placed in a centered, responsive container for better compatibility. -->
        <div class="flex justify-center w-full mb-8">
            <div id="ad-container" class="rounded-lg overflow-hidden">
                <script type="text/javascript">
                    atOptions = {
                        'key' : '1dbb4b62ddb1371982f555d88ac205e4',
                        'format' : 'iframe',
                        'height' : 250,
                        'width' : 300,
                        'params' : {}
                    };
                </script>
                <script type="text/javascript" src="//www.highperformanceformat.com/1dbb4b62ddb1371982f555d88ac205e4/invoke.js"></script>
            </div>
        </div>

        <!-- Conversion Form -->
        <div class="w-full">
            <div class="flex flex-col md:flex-row items-center justify-center gap-4 mb-6">
                <!-- Amount Input -->
                <div class="flex-1 w-full">
                    <label for="amountInput" class="block text-sm font-medium text-gray-300 mb-1">Amount</label>
                    <input type="number" id="amountInput" value="1" min="0"
                            class="w-full p-2 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-200">
                </div>

                <!-- From Currency Selector -->
                <div class="flex-1 w-full">
                    <label for="fromCurrencySelect" class="block text-sm font-medium text-gray-300 mb-1">From</label>
                    <select id="fromCurrencySelect" class="w-full p-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
                </div>

                <!-- Swap Button -->
                <button id="swapButton" class="w-12 h-12 flex-shrink-0 bg-blue-600 hover:bg-blue-500 text-white rounded-full transition-colors duration-200 mt-6 shadow-lg transform hover:scale-110">
                    <i class="fas fa-arrow-right-arrow-left"></i>
                </button>

                <!-- To Currency Selector -->
                <div class="flex-1 w-full">
                    <label for="toCurrencySelect" class="block text-sm font-medium text-gray-300 mb-1">To</label>
                    <select id="toCurrencySelect" class="w-full p-2 rounded-lg bg-gray-700 border border-gray-600 text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
                </div>
            </div>

            <!-- Result and Info -->
            <div class="w-full text-center">
                <div class="p-4 bg-gray-700 rounded-xl">
                    <p id="resultOutput" class="text-3xl font-bold text-green-400 break-words">0.00</p>
                </div>
                <p id="rateInfo" class="text-sm text-gray-400 mt-2">Fetching exchange rates...</p>
            </div>
            
            <!-- Error/Message Area -->
            <div id="messageArea" class="mt-8 text-center text-sm font-medium w-full max-w-md hidden"></div>

        </div>
    </div>

    <script>
        // DOM Element references
        const amountInput = document.getElementById('amountInput');
        const fromCurrencySelect = document.getElementById('fromCurrencySelect');
        const toCurrencySelect = document.getElementById('toCurrencySelect');
        const swapButton = document.getElementById('swapButton');
        const resultOutput = document.getElementById('resultOutput');
        const rateInfo = document.getElementById('rateInfo');
        const messageArea = document.getElementById('messageArea');

        // Global variable to store exchange rates
        let exchangeRates = null;
        
        // Show a temporary message to the user
        const showMessage = (message, isError = false) => {
            messageArea.innerText = message;
            messageArea.className = `mt-8 text-center text-sm font-medium w-full max-w-md block rounded-md p-3 transition-opacity duration-500 ease-in-out ${isError ? 'bg-red-800 text-red-200' : 'bg-green-800 text-green-200'}`;
            messageArea.style.opacity = '1';
            setTimeout(() => {
                messageArea.style.opacity = '0';
                messageArea.addEventListener('transitionend', (e) => {
                    if (e.propertyName === 'opacity' && messageArea.style.opacity === '0') {
                        messageArea.classList.add('hidden');
                    }
                }, { once: true });
            }, 3000);
        };

        // --- Core Functionality ---

        // Fetches the latest currency exchange rates from the API
        const fetchRates = async () => {
            const apiKey = ""; // API key is not required for the free endpoint
            const apiUrl = `https://open.er-api.com/v6/latest/USD`;
            
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                if (data.result === 'success') {
                    exchangeRates = data.rates;
                    populateCurrencies();
                    convertCurrency();
                    showMessage("Exchange rates loaded!", false);
                } else {
                    throw new Error("Failed to fetch exchange rates.");
                }
            } catch (error) {
                console.error("Error fetching exchange rates:", error);
                rateInfo.textContent = "Error loading rates. Please try again later.";
                showMessage("Error fetching rates. Please try again.", true);
            }
        };

        // Populates the currency dropdowns with options
        const populateCurrencies = () => {
            const currencies = Object.keys(exchangeRates);
            fromCurrencySelect.innerHTML = '';
            toCurrencySelect.innerHTML = '';
            
            currencies.forEach(currency => {
                const fromOption = document.createElement('option');
                fromOption.value = currency;
                fromOption.textContent = currency;
                fromCurrencySelect.appendChild(fromOption);
                
                const toOption = fromOption.cloneNode(true);
                toCurrencySelect.appendChild(toOption);
            });
            
            // Set default selections
            fromCurrencySelect.value = 'USD';
            toCurrencySelect.value = 'EUR';
        };

        // Converts the amount and updates the UI
        const convertCurrency = () => {
            if (!exchangeRates) return;

            const amount = parseFloat(amountInput.value);
            const fromCurrency = fromCurrencySelect.value;
            const toCurrency = toCurrencySelect.value;

            if (isNaN(amount) || amount <= 0) {
                resultOutput.textContent = '0.00';
                return;
            }

            const fromRate = exchangeRates[fromCurrency];
            const toRate = exchangeRates[toCurrency];
            
            const convertedAmount = (amount * (toRate / fromRate)).toFixed(2);
            resultOutput.textContent = `${convertedAmount}`;
            rateInfo.textContent = `1 ${fromCurrency} = ${(toRate / fromRate).toFixed(4)} ${toCurrency}`;
        };

        // --- Event Listeners ---

        // Fetch rates on page load
        window.addEventListener('load', fetchRates);

        // Listen for input changes to perform conversion
        amountInput.addEventListener('input', convertCurrency);
        fromCurrencySelect.addEventListener('change', convertCurrency);
        toCurrencySelect.addEventListener('change', convertCurrency);

        // Swap button functionality
        swapButton.addEventListener('click', () => {
            const temp = fromCurrencySelect.value;
            fromCurrencySelect.value = toCurrencySelect.value;
            toCurrencySelect.value = temp;
            convertCurrency();
        });
    </script>
</body>
</html>
