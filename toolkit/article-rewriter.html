<!DOCTYPE html>
<html lang="en">
<head>
    
  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Article Rewriter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS for styling and font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937; /* bg-gray-800 */
        }

        ::-webkit-scrollbar-thumb {
            background-color: #4b5563; /* bg-gray-600 */
            border-radius: 6px;
            border: 3px solid #1f2937;
        }

        /* Loading spinner animation */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<meta name='google-adsense-platform-account' content='ca-host-pub-1556223355139109'/>
<meta name='google-adsense-platform-domain' content='blogspot.com'/>
</head>
<body class="bg-gray-900 text-gray-100 p-4 min-h-screen flex flex-col items-center">

    <!-- Header -->
    <header class="w-full max-w-7xl flex flex-col md:flex-row items-center justify-center py-6 px-4 mb-8">
        <h1 class="text-4xl md:text-5xl font-extrabold text-white text-center md:text-left tracking-tight mb-4 md:mb-0">
            <i class="fas fa-pencil-alt text-blue-400 mr-3"></i>AI Article Rewriter
        </h1>
    </header>

    <!-- Main Container with 'glassmorphism' effect -->
    <div class="bg-gray-800 bg-opacity-70 backdrop-filter backdrop-blur-lg p-8 md:p-12 rounded-3xl shadow-2xl w-full max-w-7xl mx-auto flex flex-col md:flex-row gap-8 border border-gray-700">

        <!-- Left Column: Input and Controls -->
        <div class="flex-1 flex flex-col">
            <label for="inputText" class="text-xl font-semibold mb-3 text-gray-300">मूल लेख</label>
            <textarea id="inputText"
                      class="w-full h-96 bg-gray-700 bg-opacity-50 text-gray-200 border border-gray-600 rounded-xl p-4 resize-y transition duration-300 ease-in-out focus:ring-2 focus:ring-blue-500 focus:outline-none placeholder-gray-500 text-base"
                      placeholder="लेख को फिर से लिखने के लिए यहां पेस्ट करें..."></textarea>
            
            <!-- Stats and Buttons -->
            <div class="mt-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex space-x-4 text-sm text-gray-400 font-medium">
                    <span>शब्द: <span id="wordCount">0</span></span>
                    <span>अक्षर: <span id="charCount">0</span></span>
                </div>
                <div class="flex space-x-3 mt-4 sm:mt-0">
                    <button id="clearButton" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-6 rounded-full shadow-lg transition duration-300 ease-in-out transform hover:scale-105">
                        <i class="fas fa-trash-alt mr-2"></i> हटाएं
                    </button>
                    <button id="rewriteButton" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded-full shadow-lg transition duration-300 ease-in-out transform hover:scale-105">
                        <i class="fas fa-pen-alt mr-2"></i> लेख को फिर से लिखें
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Column: Output and Controls -->
        <div class="flex-1 flex flex-col relative">
            <label for="outputText" class="text-xl font-semibold mb-3 text-gray-300">पुनर्लिखित लेख</label>
            <div id="outputText"
                 class="w-full h-96 bg-gray-700 bg-opacity-50 text-gray-200 border border-gray-600 rounded-xl p-4 overflow-y-auto transition duration-300 ease-in-out text-base">
                आपका पुनर्लिखित लेख यहां दिखाई देगा।
            </div>

            <!-- Output Buttons -->
            <div class="absolute bottom-4 right-4 flex space-x-2">
                <button id="copyButton" class="bg-gray-600 hover:bg-gray-500 text-white p-2 rounded-full transition duration-200 ease-in-out shadow-md">
                    <i class="fas fa-copy"></i>
                </button>
                <button id="downloadButton" class="bg-gray-600 hover:bg-gray-500 text-white p-2 rounded-full transition duration-200 ease-in-out shadow-md">
                    <i class="fas fa-download"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Message Area -->
    <div id="messageArea" class="mt-8 text-center text-sm font-medium w-full max-w-2xl hidden"></div>

    <script>
        // DOM Element references
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const rewriteButton = document.getElementById('rewriteButton');
        const clearButton = document.getElementById('clearButton');
        const copyButton = document.getElementById('copyButton');
        const downloadButton = document.getElementById('downloadButton');
        const wordCountSpan = document.getElementById('wordCount');
        const charCountSpan = document.getElementById('charCount');
        const messageArea = document.getElementById('messageArea');

        // Function to display a temporary message to the user
        const showMessage = (message, isError = false) => {
            messageArea.innerText = message;
            messageArea.className = `mt-8 text-center text-sm font-medium w-full max-w-2xl block rounded-md p-3 transition-opacity duration-500 ease-in-out ${isError ? 'bg-red-800 text-red-200' : 'bg-green-800 text-green-200'}`;
            messageArea.style.opacity = '1';
            setTimeout(() => {
                messageArea.style.opacity = '0';
                messageArea.addEventListener('transitionend', (e) => {
                    if (e.propertyName === 'opacity' && messageArea.style.opacity === '0') {
                        messageArea.classList.add('hidden');
                    }
                }, { once: true });
            }, 3000);
        };

        // Update word and character counts in real-time
        const updateCounts = () => {
            const text = inputText.value;
            const words = text.split(/\s+/).filter(word => word.length > 0).length;
            const characters = text.length;
            wordCountSpan.textContent = words;
            charCountSpan.textContent = characters;
        };

        // Handle the "Rewrite Article" button click
        rewriteButton.addEventListener('click', async () => {
            const originalText = inputText.value.trim();
            if (!originalText) {
                showMessage("कृपया फिर से लिखने के लिए कोई लेख दर्ज करें।", true);
                return;
            }

            // Disable button and show a loading spinner
            rewriteButton.innerHTML = `<div class="loader"></div><span class="ml-2">लेखन जारी...</span>`;
            rewriteButton.disabled = true;
            clearButton.disabled = true;
            outputText.innerHTML = '';
            
            const prompt = `Rewrite the following article to be more clear, engaging, and concise. Do not change the core meaning. Article: ${originalText}`;
            
            // Gemini API call configuration (API key is automatically provided)
            const apiKey = "AIzaSyB3Nb0mlF1HTe1CP8pvhK7wgYGI8FgC_yA";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{
                    parts: [{ text: prompt }]
                }]
            };

            let success = false;
            let retryCount = 0;
            const maxRetries = 3;
            const baseDelay = 1000; // 1 second

            while (!success && retryCount < maxRetries) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if (response.status === 429) {
                            // Rate limit exceeded, retry with exponential backoff
                            const delay = baseDelay * Math.pow(2, retryCount);
                            await new Promise(res => setTimeout(res, delay));
                            retryCount++;
                            continue;
                        } else {
                            // Other HTTP error
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                    }

                    const result = await response.json();
                    
                    if (result.candidates && result.candidates.length > 0 &&
                        result.candidates[0].content && result.candidates[0].content.parts &&
                        result.candidates[0].content.parts.length > 0) {
                        
                        const rewrittenText = result.candidates[0].content.parts[0].text;
                        outputText.innerText = rewrittenText;
                        success = true;
                        showMessage("लेख सफलतापूर्वक फिर से लिखा गया!", false);
                    } else {
                        throw new Error("API से अमान्य प्रतिक्रिया प्रारूप।");
                    }
                } catch (error) {
                    // console.error("Gemini API से डेटा प्राप्त करने में त्रुटि:", error);
                    // If it's not a rate limit error, break the retry loop
                    if (error.message.indexOf('429') === -1) {
                         showMessage("एक त्रुटि हुई। कृपया पुन: प्रयास करें।", true);
                         break;
                    }
                }
            }

            // Reset button state
            rewriteButton.innerHTML = `<i class="fas fa-pen-alt mr-2"></i> लेख को फिर से लिखें`;
            rewriteButton.disabled = false;
            clearButton.disabled = false;
        });

        // Handle the "Clear Text" button click
        clearButton.addEventListener('click', () => {
            inputText.value = '';
            outputText.innerText = "आपका पुनर्लिखित लेख यहां दिखाई देगा।";
            updateCounts();
            showMessage("टेक्स्ट फ़ील्ड साफ़ कर दिए गए हैं।", false);
        });

        // Handle the "Copy to Clipboard" button click
        copyButton.addEventListener('click', () => {
            const textToCopy = outputText.innerText;
            if (textToCopy && textToCopy !== "आपका पुनर्लिखित लेख यहां दिखाई देगा।") {
                // Use the older document.execCommand('copy') for better iframe compatibility
                const tempTextarea = document.createElement('textarea');
                tempTextarea.value = textToCopy;
                document.body.appendChild(tempTextarea);
                tempTextarea.select();
                document.execCommand('copy');
                document.body.removeChild(tempTextarea);
                showMessage("पुनर्लिखित लेख कॉपी कर लिया गया है!", false);
            } else {
                showMessage("कॉपी करने के लिए कोई टेक्स्ट नहीं है।", true);
            }
        });

        // Handle the "Download as TXT" button click
        downloadButton.addEventListener('click', () => {
            const textToDownload = outputText.innerText;
            if (textToDownload && textToDownload !== "आपका पुनर्लिखित लेख यहां दिखाई देगा।") {
                const blob = new Blob([textToDownload], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'rewritten_article.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showMessage("लेख को TXT फ़ाइल के रूप में डाउनलोड किया गया है।", false);
            } else {
                showMessage("डाउनलोड करने के लिए कुछ भी नहीं है।", true);
            }
        });

        // Initial count update
        updateCounts();
    </script>
</body>
</html>
