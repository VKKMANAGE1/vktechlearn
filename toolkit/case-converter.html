<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Converter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Set font to Inter */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937; /* bg-gray-800 */
        }

        ::-webkit-scrollbar-thumb {
            background-color: #4b5563; /* bg-gray-600 */
            border-radius: 6px;
            border: 3px solid #1f2937;
        }
    </style>
<meta name='google-adsense-platform-account' content='ca-host-pub-1556223355139109'/>
<meta name='google-adsense-platform-domain' content='blogspot.com'/>
</head>
<body class="bg-gray-900 text-gray-100 p-4 min-h-screen flex items-center justify-center">

    <!-- Main Container -->
    <div class="bg-gray-800 p-8 md:p-12 rounded-2xl shadow-2xl w-full max-w-4xl mx-auto text-center">

        <!-- Header -->
        <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-6 md:mb-10 tracking-tight">
            <i class="fas fa-text-height text-blue-400 mr-3"></i>Case Converter
        </h1>

        <!-- Ad Banner Container -->
        <!-- The advertisement is placed here for maximum visibility without disrupting the main functionality. -->
        <div class="my-8 w-full max-w-[728px] mx-auto">
            <div id="ad-container" class="rounded-lg overflow-hidden">
                <script type="text/javascript">
                    atOptions = {
                        'key' : '3d5b2aedf533bb2789211f298e06dff2',
                        'format' : 'iframe',
                        'height' : 90,
                        'width' : 728,
                        'params' : {}
                    };
                </script>
                <script type="text/javascript" src="//www.highperformanceformat.com/3d5b2aedf533bb2789211f298e06dff2/invoke.js"></script>
            </div>
        </div>

        <!-- Text Area -->
        <textarea id="textInput"
                  class="w-full h-64 bg-gray-700 text-gray-200 border border-gray-600 rounded-xl p-4 resize-y transition duration-300 ease-in-out focus:ring-2 focus:ring-blue-500 focus:outline-none placeholder-gray-500 text-base mb-6"
                  placeholder="Paste your text here to convert its case."></textarea>
        
        <!-- Conversion Buttons -->
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-4 mb-6">
            <button id="upperCase" class="bg-gray-700 hover:bg-gray-600 text-gray-200 font-semibold py-3 px-4 rounded-xl transition duration-200 ease-in-out shadow-md">
                UPPER CASE
            </button>
            <button id="lowerCase" class="bg-gray-700 hover:bg-gray-600 text-gray-200 font-semibold py-3 px-4 rounded-xl transition duration-200 ease-in-out shadow-md">
                lower case
            </button>
            <button id="sentenceCase" class="bg-gray-700 hover:bg-gray-600 text-gray-200 font-semibold py-3 px-4 rounded-xl transition duration-200 ease-in-out shadow-md">
                Sentence case.
            </button>
            <button id="titleCase" class="bg-gray-700 hover:bg-gray-600 text-gray-200 font-semibold py-3 px-4 rounded-xl transition duration-200 ease-in-out shadow-md">
                Title Case
            </button>
            <button id="alternatingCase" class="bg-gray-700 hover:bg-gray-600 text-gray-200 font-semibold py-3 px-4 rounded-xl transition duration-200 ease-in-out shadow-md">
                aLtErNaTiNg CaSe
            </button>
            <button id="inverseCase" class="bg-gray-700 hover:bg-gray-600 text-gray-200 font-semibold py-3 px-4 rounded-xl transition duration-200 ease-in-out shadow-md">
                iNVERSE cASE
            </button>
        </div>

        <!-- Utility Buttons -->
        <div class="flex flex-col sm:flex-row justify-end gap-4">
            <button id="copyButton" class="bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-6 rounded-full transition duration-300 ease-in-out transform hover:scale-105 shadow-lg">
                <i class="fas fa-copy mr-2"></i> Copy
            </button>
            <button id="clearButton" class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-6 rounded-full transition duration-300 ease-in-out transform hover:scale-105 shadow-lg">
                <i class="fas fa-trash-alt mr-2"></i> Clear
            </button>
        </div>
        
        <!-- Error/Message Area -->
        <div id="messageArea" class="mt-8 text-center text-sm font-medium w-full max-w-md hidden"></div>

    </div>

    <script>
        // DOM Element references
        const textInput = document.getElementById('textInput');
        const upperCaseButton = document.getElementById('upperCase');
        const lowerCaseButton = document.getElementById('lowerCase');
        const sentenceCaseButton = document.getElementById('sentenceCase');
        const titleCaseButton = document.getElementById('titleCase');
        const alternatingCaseButton = document.getElementById('alternatingCase');
        const inverseCaseButton = document.getElementById('inverseCase');
        const copyButton = document.getElementById('copyButton');
        const clearButton = document.getElementById('clearButton');
        const messageArea = document.getElementById('messageArea');

        // Show a temporary message to the user
        const showMessage = (message, isError = false) => {
            messageArea.innerText = message;
            messageArea.className = `mt-8 text-center text-sm font-medium w-full max-w-md block rounded-md p-3 transition-opacity duration-500 ease-in-out ${isError ? 'bg-red-800 text-red-200' : 'bg-green-800 text-green-200'}`;
            messageArea.style.opacity = '1';
            setTimeout(() => {
                messageArea.style.opacity = '0';
                messageArea.addEventListener('transitionend', (e) => {
                    if (e.propertyName === 'opacity' && messageArea.style.opacity === '0') {
                        messageArea.classList.add('hidden');
                    }
                }, { once: true });
            }, 3000);
        };

        // --- Conversion Logic Functions ---

        const toUpperCase = (text) => text.toUpperCase();
        const toLowerCase = (text) => text.toLowerCase();
        
        const toSentenceCase = (text) => {
            if (!text) return "";
            return text.toLowerCase().replace(/(^\s*|\.\s*|\!\s*|\?\s*)([a-z])/g, (match) => match.toUpperCase());
        };

        const toTitleCase = (text) => {
            if (!text) return "";
            const minorWords = ['a', 'an', 'and', 'as', 'at', 'but', 'by', 'for', 'in', 'nor', 'of', 'on', 'or', 'so', 'the', 'to', 'up', 'yet'];
            
            return text.toLowerCase().split(' ').map((word, index) => {
                if (index === 0 || !minorWords.includes(word)) {
                    return word.charAt(0).toUpperCase() + word.slice(1);
                }
                return word;
            }).join(' ');
        };

        const toAlternatingCase = (text) => {
            if (!text) return "";
            return text.split('').map((char, index) => {
                return index % 2 === 0 ? char.toLowerCase() : char.toUpperCase();
            }).join('');
        };
        
        const toInverseCase = (text) => {
            if (!text) return "";
            return text.split('').map((char) => {
                if (char === char.toUpperCase() && char !== char.toLowerCase()) {
                    return char.toLowerCase();
                } else if (char === char.toLowerCase() && char !== char.toUpperCase()) {
                    return char.toUpperCase();
                }
                return char;
            }).join('');
        };

        // --- Event Listeners ---
        
        upperCaseButton.addEventListener('click', () => {
            textInput.value = toUpperCase(textInput.value);
            showMessage("Converted to UPPER CASE!", false);
        });

        lowerCaseButton.addEventListener('click', () => {
            textInput.value = toLowerCase(textInput.value);
            showMessage("Converted to lower case!", false);
        });

        sentenceCaseButton.addEventListener('click', () => {
            textInput.value = toSentenceCase(textInput.value);
            showMessage("Converted to sentence case!", false);
        });

        titleCaseButton.addEventListener('click', () => {
            textInput.value = toTitleCase(textInput.value);
            showMessage("Converted to Title Case!", false);
        });

        alternatingCaseButton.addEventListener('click', () => {
            textInput.value = toAlternatingCase(textInput.value);
            showMessage("Converted to alternating case!", false);
        });

        inverseCaseButton.addEventListener('click', () => {
            textInput.value = toInverseCase(textInput.value);
            showMessage("Converted to inverse case!", false);
        });
        
        copyButton.addEventListener('click', () => {
            if (textInput.value) {
                // Use the older document.execCommand('copy') for better iframe compatibility
                textInput.select();
                document.execCommand('copy');
                showMessage("Text copied to clipboard!", false);
            } else {
                showMessage("No text to copy.", true);
            }
        });
        
        clearButton.addEventListener('click', () => {
            textInput.value = '';
            showMessage("Text cleared.", false);
        });
    </script>
</body>
</html>
