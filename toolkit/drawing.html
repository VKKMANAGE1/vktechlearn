<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Set font to Inter */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937; /* bg-gray-800 */
        }

        ::-webkit-scrollbar-thumb {
            background-color: #4b5563; /* bg-gray-600 */
            border-radius: 6px;
            border: 3px solid #1f2937;
        }
        
        /* The canvas should fill its container */
        canvas {
            touch-action: none; /* Prevents default touch behavior like scrolling */
            cursor: crosshair;
        }
    </style>
<meta name='google-adsense-platform-account' content='ca-host-pub-1556223355139109'/>
<meta name='google-adsense-platform-domain' content='blogspot.com'/>
</head>
<body class="bg-gray-900 text-gray-100 p-4 min-h-screen flex flex-col items-center">

    <!-- Main Container -->
    <div class="bg-gray-800 p-4 md:p-8 rounded-2xl shadow-2xl w-full max-w-5xl mx-auto flex flex-col items-center">

        <!-- Header -->
        <h1 class="text-3xl md:text-4xl font-extrabold text-white mb-6 text-center tracking-tight">
            <i class="fas fa-paintbrush text-blue-400 mr-2"></i>Simple Drawing App
        </h1>

        <!-- Toolbar -->
        <div class="w-full flex flex-wrap items-center justify-center gap-4 p-4 bg-gray-700 rounded-xl shadow-inner mb-6">
            
            <!-- Color Picker -->
            <div class="flex items-center gap-2">
                <label for="colorPicker" class="text-gray-300">Color:</label>
                <input type="color" id="colorPicker" value="#ffffff" class="w-10 h-10 rounded-full cursor-pointer border-none">
            </div>

            <!-- Brush Size Slider -->
            <div class="flex items-center gap-2">
                <label for="brushSize" class="text-gray-300">Size:</label>
                <input type="range" id="brushSize" min="1" max="50" value="5" class="w-24 md:w-32 accent-blue-500 cursor-pointer">
                <span id="brushSizeValue" class="text-gray-400 w-6 text-center">5</span>
            </div>
            
            <!-- Tool Buttons -->
            <div class="flex items-center space-x-2">
                <button id="brushButton" class="p-3 rounded-lg bg-blue-600 text-white shadow-md transition-transform hover:scale-105 active:bg-blue-500">
                    <i class="fas fa-brush"></i>
                </button>
                <button id="eraserButton" class="p-3 rounded-lg bg-gray-600 text-white shadow-md transition-transform hover:scale-105 active:bg-gray-500">
                    <i class="fas fa-eraser"></i>
                </button>
            </div>

            <!-- Action Buttons -->
            <button id="clearButton" class="p-3 rounded-lg bg-red-600 text-white font-semibold shadow-md transition-transform hover:scale-105 active:bg-red-500">
                <i class="fas fa-trash-alt mr-2"></i>Clear
            </button>
            <button id="saveButton" class="p-3 rounded-lg bg-green-600 text-white font-semibold shadow-md transition-transform hover:scale-105 active:bg-green-500">
                <i class="fas fa-download mr-2"></i>Save
            </button>
        </div>

        <!-- Placeholder for Banner Ad -->
        <!-- This placeholder is for design purposes. The real ad script will replace this div when hosted on a live site. -->
        <div class="my-6 w-full max-w-7xl h-[90px] md:h-[90px] flex items-center justify-center bg-gray-700 rounded-lg border border-gray-600 shadow-inner">
            <span class="text-gray-400 text-center font-medium">Ad Placeholder (728x90)</span>
        </div>

        <!-- Drawing Canvas -->
        <canvas id="drawingCanvas" class="bg-white rounded-xl shadow-inner border border-gray-600 w-full h-auto" width="800" height="600"></canvas>
    </div>

    <script>
        // DOM Element references
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const brushSizeSlider = document.getElementById('brushSize');
        const brushSizeValue = document.getElementById('brushSizeValue');
        const brushButton = document.getElementById('brushButton');
        const eraserButton = document.getElementById('eraserButton');
        const clearButton = document.getElementById('clearButton');
        const saveButton = document.getElementById('saveButton');

        // State variables
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        // --- Canvas Setup ---

        // Set the initial canvas size based on its parent container
        const resizeCanvas = () => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        };

        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);

        // Set initial drawing properties
        ctx.strokeStyle = colorPicker.value;
        ctx.lineWidth = brushSizeSlider.value;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.globalCompositeOperation = 'source-over'; // Default to brush

        // --- Event Listeners for Drawing ---

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            [lastX, lastY] = [e.offsetX, e.offsetY];
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
            [lastX, lastY] = [e.offsetX, e.offsetY];
        });

        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseleave', () => isDrawing = false);

        // --- Touch Events for Mobile ---
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            isDrawing = true;
            [lastX, lastY] = [touch.clientX - rect.left, touch.clientY - rect.top];
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isDrawing) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
            ctx.stroke();
            [lastX, lastY] = [touch.clientX - rect.left, touch.clientY - rect.top];
        }, { passive: false });

        canvas.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('touchcancel', () => isDrawing = false);


        // --- Toolbar Control Event Listeners ---

        // Update brush color
        colorPicker.addEventListener('input', () => {
            ctx.strokeStyle = colorPicker.value;
            ctx.globalCompositeOperation = 'source-over';
        });

        // Update brush size and display its value
        brushSizeSlider.addEventListener('input', () => {
            ctx.lineWidth = brushSizeSlider.value;
            brushSizeValue.textContent = brushSizeSlider.value;
        });

        // Switch to Brush tool
        brushButton.addEventListener('click', () => {
            ctx.globalCompositeOperation = 'source-over';
            brushButton.classList.add('bg-blue-600', 'text-white');
            brushButton.classList.remove('bg-gray-600');
            eraserButton.classList.remove('bg-blue-600', 'text-white');
            eraserButton.classList.add('bg-gray-600');
        });

        // Switch to Eraser tool
        eraserButton.addEventListener('click', () => {
            ctx.globalCompositeOperation = 'destination-out';
            eraserButton.classList.add('bg-blue-600', 'text-white');
            eraserButton.classList.remove('bg-gray-600');
            brushButton.classList.remove('bg-blue-600', 'text-white');
            brushButton.classList.add('bg-gray-600');
        });

        // Clear the canvas
        clearButton.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // Save the canvas as a PNG
        saveButton.addEventListener('click', () => {
            const dataURL = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = dataURL;
            link.download = 'my-drawing.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

    </script>
</body>
</html>
