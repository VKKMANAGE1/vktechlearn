<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS for styling and font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom styling for the date input to match the dark theme and add a modern look */
        input[type="date"] {
            background-color: rgba(255, 255, 255, 0.1);
            color: #E5E7EB; /* gray-200 */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease-in-out;
            cursor: pointer;
        }

        input[type="date"]:hover {
            border-color: rgba(255, 255, 255, 0.4);
        }

        input[type="date"]:focus {
            outline: none;
            border-color: #A78BFA; /* violet-400 */
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.5);
        }
    </style>
<meta name='google-adsense-platform-account' content='ca-host-pub-1556223355139109'/>
<meta name='google-adsense-platform-domain' content='blogspot.com'/>
</head>
<body class="bg-gradient-to-br from-gray-900 via-slate-800 to-indigo-900 text-gray-100 p-4 min-h-screen flex flex-col items-center justify-center">

    <!-- Main Container -->
    <div class="bg-gray-800 bg-opacity-70 backdrop-filter backdrop-blur-lg p-8 md:p-12 rounded-3xl shadow-2xl w-full max-w-lg mx-auto text-center border border-gray-700">

        <!-- Header -->
        <h1 class="text-3xl md:text-4xl font-extrabold text-white mb-6 md:mb-8 tracking-tight">
            <span class="text-violet-400">Age</span> Calculator
        </h1>

        <!-- Input Section -->
        <div class="mb-8">
            <label for="dobInput" class="block text-lg font-semibold mb-3 text-gray-300">अपनी जन्मतिथि चुनें</label>
            <input type="date" id="dobInput" class="w-full">
        </div>

        <!-- Button -->
        <button id="calculateButton" class="w-full bg-violet-600 hover:bg-violet-500 text-white font-bold py-3 px-8 rounded-full shadow-lg transition duration-300 ease-in-out transform hover:scale-105">
            उम्र निकालें
        </button>

        <!-- Output Section -->
        <div id="outputSection" class="mt-10 p-6 bg-gray-700 rounded-xl hidden border border-gray-600">
            <!-- Age Breakdown -->
            <div class="mb-6">
                <p class="text-xl font-medium text-gray-300 mb-4">आपकी उम्र है:</p>
                <div class="flex justify-around items-center space-x-4">
                    <div class="flex flex-col items-center">
                        <span id="years" class="text-4xl md:text-6xl font-extrabold text-teal-400">0</span>
                        <span class="text-sm text-gray-400 mt-1">साल</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <span id="months" class="text-4xl md:text-6xl font-extrabold text-teal-400">0</span>
                        <span class="text-sm text-gray-400 mt-1">महीने</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <span id="days" class="text-4xl md:text-6xl font-extrabold text-teal-400">0</span>
                        <span class="text-sm text-gray-400 mt-1">दिन</span>
                    </div>
                </div>
            </div>

            <hr class="border-gray-600 my-6">

            <!-- Next Birthday Countdown -->
            <div>
                <p class="text-lg font-medium text-gray-300 mb-2">अगले जन्मदिन तक का समय:</p>
                <div class="flex justify-center space-x-4">
                    <div class="flex flex-col items-center">
                        <span id="nextBirthdayMonths" class="text-2xl font-bold text-rose-400">0</span>
                        <span class="text-sm text-gray-400">महीने</span>
                    </div>
                    <div class="flex flex-col items-center">
                        <span id="nextBirthdayDays" class="text-2xl font-bold text-rose-400">0</span>
                        <span class="text-sm text-gray-400">दिन</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Message Area for warnings/errors -->
        <div id="messageArea" class="mt-8 text-center text-sm font-medium w-full hidden"></div>
    </div>

    <script>
        // DOM Element references for easy access
        const dobInput = document.getElementById('dobInput');
        const calculateButton = document.getElementById('calculateButton');
        const outputSection = document.getElementById('outputSection');
        const yearsSpan = document.getElementById('years');
        const monthsSpan = document.getElementById('months');
        const daysSpan = document.getElementById('days');
        const nextBirthdayMonthsSpan = document.getElementById('nextBirthdayMonths');
        const nextBirthdayDaysSpan = document.getElementById('nextBirthdayDays');
        const messageArea = document.getElementById('messageArea');

        // Function to display temporary messages to the user
        const showMessage = (message, isError = false) => {
            messageArea.innerText = message;
            messageArea.className = `mt-8 text-center text-sm font-medium w-full block rounded-md p-3 transition-opacity duration-500 ease-in-out ${isError ? 'bg-red-800 text-red-200' : 'bg-green-800 text-green-200'}`;
            messageArea.style.opacity = '1';
            setTimeout(() => {
                messageArea.style.opacity = '0';
                messageArea.addEventListener('transitionend', (e) => {
                    if (e.propertyName === 'opacity' && messageArea.style.opacity === '0') {
                        messageArea.classList.add('hidden');
                    }
                }, { once: true });
            }, 3000);
        };

        // Main function to calculate and display the age
        const calculateAge = () => {
            const dob = dobInput.value;
            if (!dob) {
                showMessage("कृपया अपनी जन्मतिथि चुनें।", true);
                return;
            }

            const today = new Date();
            const birthDate = new Date(dob);

            if (birthDate > today) {
                showMessage("आप भविष्य की तारीख नहीं चुन सकते।", true);
                outputSection.classList.add('hidden');
                return;
            }

            // --- Calculate Age in Years, Months, and Days ---
            let ageYears = today.getFullYear() - birthDate.getFullYear();
            let ageMonths = today.getMonth() - birthDate.getMonth();
            let ageDays = today.getDate() - birthDate.getDate();

            // Adjust for negative month or day values
            if (ageDays < 0) {
                ageMonths--;
                // Get number of days in the previous month
                ageDays += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
            }
            if (ageMonths < 0) {
                ageYears--;
                ageMonths += 12;
            }

            // --- Calculate Next Birthday Countdown ---
            const nextBirthday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
            if (nextBirthday < today) {
                // If this year's birthday has passed, calculate for next year
                nextBirthday.setFullYear(today.getFullYear() + 1);
            }

            const nextBirthdayMilliseconds = nextBirthday - today;
            const nextBirthdayDaysLeft = Math.floor(nextBirthdayMilliseconds / (1000 * 60 * 60 * 24));
            
            // A simple way to get months and remaining days for next birthday
            let nextBirthdayMonthsLeft = Math.floor(nextBirthdayDaysLeft / 30.44); // Approx days per month
            let nextBirthdayDaysRem = nextBirthdayDaysLeft % 30;

            // Update the UI with the calculated results
            yearsSpan.textContent = ageYears;
            monthsSpan.textContent = ageMonths;
            daysSpan.textContent = ageDays;
            
            nextBirthdayMonthsSpan.textContent = nextBirthdayMonthsLeft;
            nextBirthdayDaysSpan.textContent = nextBirthdayDaysRem;

            // Show the results section
            outputSection.classList.remove('hidden');
        };

        // Event listener for the button click
        calculateButton.addEventListener('click', calculateAge);

        // Optional: Trigger calculation on 'Enter' key press in the input field
        dobInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                calculateAge();
            }
        });
    </script>
</body>
</html>
