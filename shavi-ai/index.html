<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shavi AI — मुफ़्त हिंदी AI चैट | VK Tech Learn</title>
  <meta name="description" content="Shavi AI से हिंदी में कुछ भी पूछें — पढ़ाई, कंप्यूटर, मोबाइल, PDF और इमेज टूल्स। बिना लॉगिन, बिल्कुल मुफ़्त।" />
  <link rel="canonical" href="https://vktechlearn.site/shavi-ai/" />
  <meta name="color-scheme" content="dark" />
  <!-- Shavi AI backend. खाली = इसी डोमेन पर API; Space लाइव होने पर
       https://<username>-shavi-ai.hf.space जैसा URL यहाँ डालें। -->
  <meta name="shavi-ai-api" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Sora:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --line: rgba(255, 255, 255, .16);
      --glass: rgba(255, 255, 255, .08);
      --soft: rgba(255, 255, 255, .72);
      --pink: #fbcfe8;
      --sidebar: rgba(14, 9, 40, .55);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: #fff;
      font-family: 'Mukta', system-ui, sans-serif;
      font-size: 16.5px;
      line-height: 1.7;
      background: linear-gradient(135deg, #1f1a4d 0%, #43168a 48%, #7d157f 100%) fixed;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(circle at 8% 4%, rgba(255,255,255,.15), transparent 40%),
        radial-gradient(circle at 92% 96%, rgba(244,114,182,.26), transparent 46%);
    }
    button { font: inherit; cursor: pointer; }
    a { color: var(--pink); }

    .app { position: relative; display: flex; height: 100%; min-height: 100vh; }

    /* ---------- sidebar ---------- */
    .sidebar {
      width: 274px; flex: 0 0 auto; display: flex; flex-direction: column; gap: .7rem;
      padding: .9rem .75rem; background: var(--sidebar);
      border-right: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      z-index: 20;
    }
    .brand { display: inline-flex; align-items: center; gap: .6rem; color: #fff; text-decoration: none; padding: .2rem .25rem; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
      font-family: 'Sora', sans-serif; font-weight: 800; font-size: .82rem;
      background: linear-gradient(135deg, #a78bfa, #f472b6);
      box-shadow: 0 10px 22px -14px rgba(244,114,182,.9);
    }
    .brand-text { display: grid; line-height: 1.1; }
    .brand-text b { font-family: 'Sora', sans-serif; font-size: .98rem; }
    .brand-text span { font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); }

    .new-chat {
      display: flex; align-items: center; justify-content: center; gap: .45rem;
      width: 100%; padding: .66rem .8rem; border-radius: 12px;
      border: 1px solid var(--line); background: rgba(255,255,255,.14); color: #fff;
      font-family: 'Sora', sans-serif; font-size: .86rem; font-weight: 600;
    }
    .new-chat:hover { background: rgba(255,255,255,.24); }

    .history-label { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); padding: .5rem .35rem .1rem; }
    .history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .2rem; padding-right: .1rem; }
    .history-empty { font-size: .82rem; color: var(--soft); padding: .3rem .35rem; }
    .chat-item {
      display: flex; align-items: center; gap: .4rem; width: 100%;
      padding: .5rem .55rem; border: 0; border-radius: 9px; background: transparent; color: #fff;
      text-align: left; font-size: .86rem;
    }
    .chat-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chat-item:hover { background: rgba(255,255,255,.1); }
    .chat-item[aria-current="true"] { background: rgba(255,255,255,.18); }
    .chat-item .del { opacity: .55; font-size: .9rem; padding: 0 .2rem; background: none; border: 0; color: #fff; }
    .chat-item .del:hover { opacity: 1; color: #fecaca; }

    .side-foot { border-top: 1px solid var(--line); padding-top: .55rem; display: grid; gap: .2rem; font-size: .8rem; }
    .side-foot a { display: flex; gap: .4rem; padding: .35rem .4rem; border-radius: 8px; color: #fff; text-decoration: none; opacity: .85; }
    .side-foot a:hover { background: rgba(255,255,255,.1); opacity: 1; }

    /* ---------- main ---------- */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100vh; }
    .topbar {
      display: flex; align-items: center; gap: .7rem; padding: .75rem 1rem;
      border-bottom: 1px solid var(--line); background: rgba(10, 6, 30, .25);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .burger { display: none; background: rgba(255,255,255,.1); border: 1px solid var(--line); color: #fff; border-radius: 10px; width: 38px; height: 38px; }
    .title-block { flex: 1; min-width: 0; }
    .title-block h1 { font-family: 'Sora', sans-serif; margin: 0; font-size: 1rem; }
    .title-block p { margin: 0; font-size: .76rem; color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status {
      display: inline-flex; align-items: center; gap: .4rem; font-size: .76rem; color: var(--soft);
      border: 1px solid var(--line); border-radius: 999px; padding: .28rem .65rem; white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #fbbf24; box-shadow: 0 0 10px #fbbf24; }

    .thread { flex: 1; overflow-y: auto; padding: 1.2rem 1rem 0; scroll-behavior: smooth; }
    .thread-inner { width: min(760px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; padding-bottom: 1rem; }

    .welcome { text-align: center; padding: 3.5rem 0 1rem; }
    .welcome h2 { font-family: 'Sora', sans-serif; font-size: clamp(1.5rem, 4vw, 2rem); margin: 0 0 .5rem; }
    .welcome p { margin: 0 auto; max-width: 520px; color: rgba(255,255,255,.85); }
    .welcome .badge {
      display: inline-block; margin-top: .9rem; font-size: .76rem; letter-spacing: .05em;
      border: 1px solid var(--line); border-radius: 999px; padding: .3rem .8rem; background: rgba(255,255,255,.08);
    }

    .row { display: flex; gap: .7rem; align-items: flex-start; }
    .row.user { justify-content: flex-end; }
    .avatar {
      width: 30px; height: 30px; flex: 0 0 auto; border-radius: 9px; display: grid; place-items: center;
      font-family: 'Sora', sans-serif; font-size: .7rem; font-weight: 800; color: #2b1a4d;
      background: linear-gradient(135deg, #c4b5fd, #f9a8d4);
    }
    .bubble {
      max-width: 86%; padding: .8rem 1rem; border-radius: 16px; white-space: normal; word-wrap: break-word;
      background: rgba(255,255,255,.1); border: 1px solid var(--line); border-top-left-radius: 5px;
    }
    .row.user .bubble {
      background: linear-gradient(135deg, #7c3aed, #db2777);
      border: 0; border-top-left-radius: 16px; border-top-right-radius: 5px;
    }
    .bubble p { margin: 0 0 .6rem; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble ul, .bubble ol { margin: .3rem 0 .6rem; padding-left: 1.2rem; }
    .bubble li { margin: .18rem 0; }
    .bubble h3 { font-family: 'Sora', sans-serif; font-size: .98rem; margin: .6rem 0 .3rem; }
    .bubble code {
      background: rgba(0,0,0,.32); padding: .1rem .35rem; border-radius: 5px;
      font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: .88em;
    }
    .bubble pre {
      background: rgba(0,0,0,.38); border: 1px solid var(--line); border-radius: 10px;
      padding: .7rem .85rem; overflow-x: auto; margin: .5rem 0;
    }
    .bubble pre code { background: none; padding: 0; }
    .bubble a { color: #fde3f1; }
    .msg-tools { display: flex; gap: .45rem; margin-top: .45rem; }
    .msg-tools button {
      background: none; border: 1px solid var(--line); color: var(--soft);
      font-size: .72rem; border-radius: 7px; padding: .16rem .5rem;
    }
    .msg-tools button:hover { color: #fff; background: rgba(255,255,255,.12); }

    .typing span {
      display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%;
      background: #fff; opacity: .55; animation: bounce 1s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-5px); opacity: 1; } }

    /* ---------- composer ---------- */
    .composer-wrap { padding: .4rem 1rem 1rem; background: linear-gradient(0deg, rgba(8,4,26,.55), transparent); }
    .composer-inner { width: min(760px, 100%); margin: 0 auto; }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; margin-bottom: .7rem; }
    .chip {
      font-size: .8rem; color: #fff; background: rgba(255,255,255,.08);
      border: 1px solid var(--line); border-radius: 999px; padding: .34rem .8rem;
    }
    .chip:hover { background: rgba(255,255,255,.2); }
    .composer {
      display: flex; gap: .5rem; align-items: flex-end; padding: .45rem .45rem .45rem .8rem;
      background: rgba(255,255,255,.1); border: 1px solid var(--line); border-radius: 16px;
      backdrop-filter: blur(10px);
    }
    textarea {
      flex: 1; resize: none; border: 0; background: transparent; color: #fff; font: inherit;
      min-height: 30px; max-height: 160px; padding: .35rem 0; outline: none;
    }
    textarea::placeholder { color: rgba(255,255,255,.55); }
    .send {
      width: 40px; height: 40px; border-radius: 12px; border: 0; background: #fff; color: #2b1a4d;
      display: grid; place-items: center; font-size: 1rem; flex: 0 0 auto;
    }
    .send:disabled { opacity: .5; cursor: not-allowed; }
    .send.stop { background: #fca5a5; }
    .hint { margin: .5rem 0 0; text-align: center; font-size: .72rem; color: var(--soft); }
    .hint a { color: #fff; }

    .scrim { display: none; }

    @media (max-width: 840px) {
      .sidebar {
        position: fixed; inset: 0 auto 0 0; transform: translateX(-100%);
        transition: transform .25s ease; width: 82%; max-width: 300px;
      }
      .app.nav-open .sidebar { transform: none; }
      .app.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 10; }
      .burger { display: grid; place-items: center; }
      .main { height: 100vh; }
      body { font-size: 16px; }
      .bubble { max-width: 92%; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="चैट इतिहास">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">VK</span>
        <span class="brand-text"><b>Shavi AI</b><span>VK Tech Learn</span></span>
      </a>
      <button class="new-chat" id="new-chat" type="button">＋ नई चैट</button>
      <div class="history-label">आपकी चैट</div>
      <div class="history" id="history"></div>
      <div class="side-foot">
        <a href="/">← वेबसाइट</a>
        <a href="/pdf/">PDF टूल्स</a>
        <a href="/img/">इमेज टूल्स</a>
        <a href="/contact.html">संपर्क</a>
      </div>
    </aside>

    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="burger" id="burger" type="button" aria-label="मेन्यू">☰</button>
        <div class="title-block">
          <h1>Shavi AI</h1>
          <p id="chat-title">नई चैट</p>
        </div>
        <span class="status"><span class="dot" id="dot"></span><span id="status-text">जुड़ रहा है…</span></span>
      </header>

      <div class="thread" id="thread">
        <div class="thread-inner" id="thread-inner"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer-inner">
          <div class="chips" id="chips">
            <button class="chip" type="button">PDF को Word में कैसे बदलें?</button>
            <button class="chip" type="button">इमेज का साइज़ कम कैसे करें?</button>
            <button class="chip" type="button">लैपटॉप स्लो क्यों हो गया?</button>
            <button class="chip" type="button">10वीं के बाद क्या करें?</button>
          </div>
          <form class="composer" id="form">
            <textarea id="input" rows="1" maxlength="2000" placeholder="कुछ भी पूछें… (Shift + Enter = नई लाइन)" aria-label="अपना सवाल"></textarea>
            <button class="send" id="send" type="submit" aria-label="भेजें">➤</button>
          </form>
          <p class="hint">Shavi AI गलत भी हो सकता है — ज़रूरी बात जाँच लें · <a href="/privacy-policy.html">Privacy</a> · <a href="/terms-conditions.html">Terms</a></p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API = (document.querySelector('meta[name="shavi-ai-api"]').content || '').replace(/\/$/, '');
    const STORE = 'shavi-ai-chats-v1';
    const MAX_CHARS = 2000;

    const el = (id) => document.getElementById(id);
    const thread = el('thread');
    const inner = el('thread-inner');
    const form = el('form');
    const input = el('input');
    const sendBtn = el('send');
    const chips = el('chips');
    const historyEl = el('history');
    const chatTitle = el('chat-title');
    const app = el('app');

    let chats = load();
    let activeId = chats.length ? chats[0].id : null;
    let online = false;
    let busy = false;
    let controller = null;

    function load() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORE) || '[]');
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }
    function save() {
      try { localStorage.setItem(STORE, JSON.stringify(chats.slice(0, 40))); } catch (error) {}
    }
    function activeChat() {
      return chats.find((c) => c.id === activeId) || null;
    }
    function newChat() {
      activeId = null;
      renderHistory();
      renderThread();
      input.value = '';
      autosize();
      input.focus();
      app.classList.remove('nav-open');
    }

    function renderHistory() {
      historyEl.innerHTML = '';
      if (!chats.length) {
        historyEl.innerHTML = '<p class="history-empty">अभी कोई चैट नहीं — नीचे लिखकर शुरू करें।</p>';
        return;
      }
      chats.forEach((chat) => {
        const row = document.createElement('div');
        row.className = 'chat-item';
        row.setAttribute('role', 'button');
        row.tabIndex = 0;
        row.setAttribute('aria-current', String(chat.id === activeId));
        const label = document.createElement('span');
        label.textContent = chat.title || 'नई चैट';
        const del = document.createElement('button');
        del.className = 'del';
        del.type = 'button';
        del.textContent = '✕';
        del.setAttribute('aria-label', 'चैट हटाएँ');
        del.addEventListener('click', (event) => {
          event.stopPropagation();
          chats = chats.filter((c) => c.id !== chat.id);
          if (activeId === chat.id) activeId = chats.length ? chats[0].id : null;
          save(); renderHistory(); renderThread();
        });
        row.append(label, del);
        row.addEventListener('click', () => {
          activeId = chat.id;
          renderHistory(); renderThread();
          app.classList.remove('nav-open');
        });
        row.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); row.click(); }
        });
        historyEl.appendChild(row);
      });
    }

    function welcome() {
      const box = document.createElement('div');
      box.className = 'welcome';
      box.innerHTML =
        '<h2>नमस्ते, मैं Shavi AI हूँ</h2>' +
        '<p>हिंदी में कुछ भी पूछें — पढ़ाई, कंप्यूटर, मोबाइल, PDF/इमेज टूल्स या रोज़मर्रा के सवाल। बिना लॉगिन, बिल्कुल मुफ़्त।</p>' +
        '<span class="badge">AI जवाब गलत भी हो सकते हैं</span>';
      inner.appendChild(box);
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function renderMarkdown(text) {
      const blocks = [];
      let html = escapeHtml(text).replace(/```([\s\S]*?)```/g, (_, code) => {
        blocks.push('<pre><code>' + code.replace(/^\n/, '') + '</code></pre>');
        return '\u0000' + (blocks.length - 1) + '\u0000';
      });

      html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (m, pre, url) => pre + '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>');
      html = html.replace(/(^|\s)(\/(?:pdf|img)\/[^\s<)]*)/g, (m, pre, url) => pre + '<a href="' + url + '">' + url + '</a>');

      html = html.split('\n').map((line) => {
        const t = line.trim();
        if (!t) return '';
        if (/^\u0000\d+\u0000$/.test(t)) return t;
        if (/^#{1,3}\s+/.test(t)) return '<h3>' + t.replace(/^#{1,3}\s+/, '') + '</h3>';
        if (/^[-*•]\s+/.test(t)) return '<li>' + t.replace(/^[-*•]\s+/, '') + '</li>';
        if (/^\d+[.)]\s+/.test(t)) return '<li>' + t.replace(/^\d+[.)]\s+/, '') + '</li>';
        return '<p>' + t + '</p>';
      }).join('');

      html = html.replace(/(?:<li>[\s\S]*?<\/li>)+/g, (list) => '<ul>' + list + '</ul>');
      html = html.replace(/\u0000(\d+)\u0000/g, (_, index) => blocks[Number(index)]);
      return html;
    }

    function addTurn(role, text) {
      const row = document.createElement('div');
      row.className = 'row ' + role;
      if (role === 'bot') {
        const avatar = document.createElement('span');
        avatar.className = 'avatar';
        avatar.textContent = 'AI';
        avatar.setAttribute('aria-hidden', 'true');
        row.appendChild(avatar);
      }
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (role === 'bot') bubble.innerHTML = renderMarkdown(text);
      else bubble.textContent = text;
      row.appendChild(bubble);
      inner.appendChild(row);
      thread.scrollTop = thread.scrollHeight;
      return { row, bubble };
    }

    function botTools(bubble, text) {
      const tools = document.createElement('div');
      tools.className = 'msg-tools';
      const copy = document.createElement('button');
      copy.type = 'button';
      copy.textContent = 'कॉपी';
      copy.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(bubble.innerText);
          copy.textContent = 'कॉपी हो गया';
          setTimeout(() => { copy.textContent = 'कॉपी'; }, 1500);
        } catch (error) {
          copy.textContent = 'नहीं हो पाया';
        }
      });
      tools.appendChild(copy);
      bubble.parentElement.appendChild(tools);
    }

    function renderThread() {
      inner.innerHTML = '';
      const chat = activeChat();
      chatTitle.textContent = chat ? chat.title : 'नई चैट';
      if (!chat || !chat.messages.length) {
        welcome();
        chips.style.display = '';
        return;
      }
      chips.style.display = 'none';
      chat.messages.forEach((message) => {
        const turn = addTurn(message.role === 'user' ? 'user' : 'bot', message.content);
        if (message.role !== 'user') botTools(turn.bubble, message.content);
      });
    }

    function autosize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    }

    function setStatus(kind, text) {
      el('status-text').textContent = text;
      const dot = el('dot');
      const colors = { ok: '#4ade80', warn: '#fbbf24', bad: '#f87171' };
      dot.style.background = colors[kind] || colors.warn;
      dot.style.boxShadow = '0 0 10px ' + (colors[kind] || colors.warn);
    }

    async function checkHealth() {
      try {
        const res = await fetch(API + '/health', { cache: 'no-store' });
        if (!res.ok) throw new Error('offline');
        const data = await res.json();
        online = true;
        input.disabled = false;
        if (data.demo) setStatus('warn', 'डेमो मोड');
        else setStatus('ok', 'ऑनलाइन');
      } catch (error) {
        online = false;
        setStatus('bad', 'सेवा जुड़ी नहीं');
        input.disabled = true;
        input.placeholder = 'AI सेवा जल्द चालू होगी…';
        sendBtn.disabled = true;
        if (!document.getElementById('offline-note')) {
          const note = document.createElement('div');
          note.id = 'offline-note';
          note.className = 'row bot';
          note.innerHTML = '<span class="avatar" aria-hidden="true">AI</span><div class="bubble">' +
            'AI सेवा अभी जुड़ी नहीं है। तब तक आप <a href="/pdf/">PDF</a> और <a href="/img/">इमेज</a> टूल्स ' +
            'इस्तेमाल कर सकते हैं, या <a href="/contact.html">संपर्क</a> कर सकते हैं।</div>';
          inner.appendChild(note);
        }
      }
    }

    async function ask(question) {
      const text = question.trim().slice(0, MAX_CHARS);
      if (!text || busy || !online) return;

      if (!activeId) {
        const chat = { id: Date.now().toString(36), title: text.slice(0, 42), messages: [], at: Date.now() };
        chats.unshift(chat);
        activeId = chat.id;
      }
      const chat = activeChat();
      chat.messages.push({ role: 'user', content: text });
      chat.at = Date.now();
      save(); renderHistory(); renderThread();

      input.value = '';
      autosize();
      busy = true;
      sendBtn.classList.add('stop');
      sendBtn.textContent = '■';
      sendBtn.disabled = false;

      const turn = addTurn('bot', '');
      turn.bubble.classList.add('typing');
      turn.bubble.innerHTML = '<span></span><span></span><span></span>';

      let answer = '';
      controller = new AbortController();

      try {
        const res = await fetch(API + '/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: chat.messages.slice(-10) }),
          signal: controller.signal,
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'सेवा में दिक्कत (HTTP ' + res.status + ')');
        }

        turn.bubble.classList.remove('typing');
        turn.bubble.textContent = '';
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\n\n');
          buffer = parts.pop();
          for (const part of parts) {
            const line = part.trim();
            if (!line.startsWith('data:')) continue;
            const payload = JSON.parse(line.slice(5).trim());
            if (payload.error) throw new Error(payload.error);
            if (payload.delta) {
              answer += payload.delta;
              turn.bubble.innerHTML = renderMarkdown(answer);
              thread.scrollTop = thread.scrollHeight;
            }
          }
        }

        if (!answer.trim()) throw new Error('खाली जवाब मिला, दोबारा कोशिश करें।');
        chat.messages.push({ role: 'assistant', content: answer });
        save();
        botTools(turn.bubble, answer);
      } catch (error) {
        turn.bubble.classList.remove('typing');
        if (error.name === 'AbortError') {
          if (answer) {
            chat.messages.push({ role: 'assistant', content: answer + '\n\n(रोका गया)' });
            save();
            turn.bubble.innerHTML = renderMarkdown(answer + '\n\n_(रोका गया)_');
          } else {
            turn.bubble.textContent = 'रोक दिया गया।';
          }
        } else {
          turn.bubble.textContent = '⚠️ ' + error.message;
        }
      } finally {
        busy = false;
        controller = null;
        sendBtn.classList.remove('stop');
        sendBtn.textContent = '➤';
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (busy && controller) { controller.abort(); return; }
      ask(input.value);
    });
    sendBtn.addEventListener('click', (event) => {
      if (busy && controller) { event.preventDefault(); controller.abort(); }
    });

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        if (!busy) ask(input.value);
      }
    });
    input.addEventListener('input', autosize);

    chips.addEventListener('click', (event) => {
      const chip = event.target.closest('button');
      if (chip) ask(chip.textContent);
    });

    el('new-chat').addEventListener('click', newChat);
    el('burger').addEventListener('click', () => app.classList.toggle('nav-open'));
    el('scrim').addEventListener('click', () => app.classList.remove('nav-open'));

    renderHistory();
    renderThread();
    checkHealth();
    input.focus();
  </script>
</body>
</html>
