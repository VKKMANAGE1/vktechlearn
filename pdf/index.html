<body class="min-h-screen bg-[#0b0f1a] text-slate-100 selection:bg-indigo-600/40 selection:text-white">

  <!-- Header -->
  <header class="stack">
    <div class="max-w-7xl mx-auto px-6 py-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3 fade-in">
          <div class="h-11 w-11 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center">
            <i class="fa-solid fa-file-pdf text-indigo-300 text-xl"></i>
          </div>
          <div>
            <h1 class="text-2xl md:text-3xl font-semibold tracking-tight">PDF Editing Toolbox</h1>
            <p class="text-slate-400 text-sm md:text-base">Fast, private, and beautiful — all in your browser</p>
          </div>
        </div>
        <div class="hidden md:flex items-center gap-3 text-sm text-slate-400">
          <i class="fa-solid fa-shield-halved"></i><span>Files stay on your device</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Info Bar -->
  <section class="stack max-w-7xl mx-auto px-6">
    <div class="rounded-2xl bg-white/[0.03] border border-white/10 p-4 backdrop-blur-sm fade-in">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-lg bg-emerald-500/10 border border-emerald-400/20 flex items-center justify-center">
          <i class="fa-solid fa-wand-magic-sparkles text-emerald-300"></i>
        </div>
        <p class="text-slate-300 text-sm md:text-[15px]">
          Click any tool to open it. All tools include live preview functionality powered by pdf-lib.
        </p>
      </div>
    </div>
  </section>

  <!-- Tools Grid -->
  <main class="stack max-w-7xl mx-auto px-6 pb-16">
    <section class="mt-6">
      <div id="toolsGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
    </section>
   <footer class="mt-10 text-center text-xs text-slate-500">
  Made By <a href="https://vktechlearn.site/" target="_blank" class="text-blue-500 hover:underline">Vïnâý Kúshwâhå</a> • Client-side PDF processing powered by pdf-lib
</footer>
  </main>

  <!-- Shared Modal -->
  <div id="toolModal" class="modal">
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <div class="modal-panel fade-in">
      <div class="rounded-2xl bg-[#0e1424]/95 border border-white/10 p-5 md:p-6 backdrop-blur-xl">
        <div class="flex items-start justify-between gap-4">
          <div class="flex items-center gap-3">
            <div id="modalIcon" class="h-10 w-10 rounded-xl border border-white/10 bg-white/5 flex items-center justify-center"></div>
            <div>
              <h2 id="modalTitle" class="text-xl md:text-2xl font-semibold"></h2>
              <p id="modalDesc" class="text-slate-400 text-sm"></p>
            </div>
          </div>
          <button onclick="closeModal()" class="h-9 w-9 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-slate-200">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="modalBody" class="mt-5"></div>
      </div>
    </div>
  </div>

  <script>
    // Libraries are loaded on demand: the page paints before these big files arrive.
    const LIBS = {
      pdfjs: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
      worker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
      pdflib: 'https://cdn.jsdelivr.net/npm/@cantoo/pdf-lib@2.11.1/dist/pdf-lib.min.js'
    };
    let libsPromise = null;
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src; s.async = true;
        s.onload = resolve;
        s.onerror = () => reject(new Error('Could not load ' + src));
        document.head.appendChild(s);
      });
    }
    function ensureLibs() {
      if (libsPromise) return libsPromise;
      libsPromise = Promise.all([loadScript(LIBS.pdflib), loadScript(LIBS.pdfjs)])
        .then(() => { pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.worker; })
        .catch((err) => { libsPromise = null; throw err; });
      return libsPromise;
    }

    // Tools config
    const tools = [
      { id:'merge',   name:'Merge PDF',         icon:'fa-object-group',     color:'text-indigo-300',  gradient:'from-indigo-500/20 to-purple-500/20', desc:'Combine multiple PDFs into one file' },
      { id:'split',   name:'Split PDF',         icon:'fa-scissors',         color:'text-rose-300',    gradient:'from-rose-500/20 to-orange-500/20',  desc:'Extract selected pages into a new PDF' },
      { id:'rotate',  name:'Rotate PDF',        icon:'fa-rotate-right',     color:'text-cyan-300',    gradient:'from-cyan-500/20 to-sky-500/20',     desc:'Rotate all pages 90°, 180°, or 270°' },
      { id:'watermark',name:'Add Watermark',    icon:'fa-water',            color:'text-blue-300',    gradient:'from-blue-500/20 to-indigo-500/20',  desc:'Place a text watermark on each page' },
      { id:'annotate',name:'PDF Annotation',    icon:'fa-highlighter',      color:'text-lime-300',    gradient:'from-lime-500/20 to-emerald-500/20', desc:'Add highlights and notes to pages' },
      { id:'sign',    name:'PDF Signatures',    icon:'fa-signature',        color:'text-pink-300',    gradient:'from-pink-500/20 to-rose-500/20',    desc:'Draw and stamp your signature' },
      { id:'compress',name:'Compress PDF',      icon:'fa-compress',         color:'text-emerald-300', gradient:'from-emerald-500/20 to-teal-500/20', desc:'Shrink image-heavy PDFs with real page compression' },
      { id:'edit',    name:'Edit PDF Text',     icon:'fa-pen-to-square',    color:'text-amber-300',   gradient:'from-amber-500/20 to-orange-500/20', desc:'Add new text on top of any page' },
      { id:'extract', name:'Extract Pages',     icon:'fa-file-export',      color:'text-sky-300',     gradient:'from-sky-500/20 to-indigo-500/20',   desc:'Extract specific pages to new PDF' },
      { id:'blank',   name:'Create Blank PDF',  icon:'fa-file-circle-plus',        color:'text-fuchsia-300', gradient:'from-fuchsia-500/20 to-indigo-500/20',desc:'Create a new blank PDF document' },
      { id:'protect', name:'Add Protection',    icon:'fa-lock',             color:'text-purple-300',  gradient:'from-purple-500/20 to-violet-500/20',desc:'Password-protect a PDF with real AES-256 encryption' },
      { id:'info',    name:'PDF Information',   icon:'fa-info-circle',      color:'text-teal-300',    gradient:'from-teal-500/20 to-cyan-500/20',    desc:'View PDF metadata and properties' },
    ];

    const grid = document.getElementById('toolsGrid');
    const modal = document.getElementById('toolModal');
    const modalIcon = document.getElementById('modalIcon');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const modalBody = document.getElementById('modalBody');

    // Build grid
    function buildGrid() {
      grid.innerHTML = '';
      tools.forEach(t => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'group text-left rounded-2xl bg-white/[0.04] border border-white/10 p-4 md:p-5 backdrop-blur-sm lift fade-in';
        card.innerHTML = `
          <div class="flex items-start gap-4">
            <div class="shrink-0 h-12 w-12 rounded-xl bg-gradient-to-br ${t.gradient} border border-white/10 flex items-center justify-center">
              <i class="fa-solid ${t.icon} ${t.color} text-xl"></i>
            </div>
            <div class="flex-1">
              <div class="flex items-center justify-between gap-3">
                <h3 class="text-base md:text-lg font-semibold tracking-tight">${t.name}</h3>
                <span class="opacity-0 group-hover:opacity-100 transition text-slate-400 text-sm">
                  <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </span>
              </div>
              <p class="text-slate-400 text-sm mt-1">${t.desc}</p>
              <div class="mt-3 text-xs text-slate-500 flex items-center gap-3">
                <span class="inline-flex items-center gap-1">
                  <i class="fa-regular fa-circle-play"></i> Open Tool
                </span>
                <span class="inline-flex items-center gap-1">
                  <i class="fa-regular fa-eye"></i> Live Preview
                </span>
              </div>
            </div>
          </div>`;
        card.addEventListener('click', () => openTool(t.id));
        grid.appendChild(card);
      });
    }

    // Modal controls
    function openModal(iconHTML, title, desc) {
      modalIcon.innerHTML = iconHTML;
      modalTitle.textContent = title;
      modalDesc.textContent = desc;
      modal.classList.add('show');
    }
    function closeModal() {
      modal.classList.remove('show');
      modalBody.innerHTML = '';
      const links = document.querySelectorAll('a[data-blob-url="1"]');
      links.forEach(a => { if (a.href && a.href.startsWith('blob:')) URL.revokeObjectURL(a.href); });
    }
    window.closeModal = closeModal;

    // Helpers
    const readArrayBuffer = file => new Promise((res, rej) => { const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsArrayBuffer(file); });
    const dataUrlToBytes = (dataUrl) => {
      const base64 = dataUrl.split(',')[1];
      const bin = atob(base64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    };
    const friendlyPdfError = (err) => {
      const msg = (err && err.message) ? err.message : String(err);
      if (/encrypted/i.test(msg)) return 'this PDF is already password protected. Remove its password first, then try again.';
      if (/password/i.test(msg) && /incorrect|invalid/i.test(msg)) return 'the password for this PDF is incorrect.';
      if (/Invalid PDF|Failed to parse|No PDF header/i.test(msg)) return 'this file does not look like a valid PDF.';
      return msg;
    };
    function createDownload(blob, filename, label='Download') {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.dataset.blobUrl='1';
      a.className='inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white transition';
      a.innerHTML = `<i class="fa-solid fa-download"></i> ${label}`;
      return a;
    }

    // PDF Preview function
    async function renderPDFPreview(file, containerId, maxPages = 3) {
      const container = document.getElementById(containerId);
      if (!container || !file) return;
      
      try {
        container.innerHTML = '<div class="p-4 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin"></i> Loading preview...</div>';
        
        const arrayBuffer = await readArrayBuffer(file);
        const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
        const numPages = Math.min(pdf.numPages, maxPages);
        
        container.innerHTML = '';
        
        for (let pageNum = 1; pageNum <= numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({scale: 0.5});
          
          const canvas = document.createElement('canvas');
          canvas.className = 'pdf-page';
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          
          const context = canvas.getContext('2d');
          await page.render({canvasContext: context, viewport: viewport}).promise;
          
          const pageDiv = document.createElement('div');
          pageDiv.className = 'text-center';
          pageDiv.innerHTML = `<div class="text-xs text-slate-400 mb-2">Page ${pageNum}</div>`;
          pageDiv.appendChild(canvas);
          container.appendChild(pageDiv);
        }
        
        if (pdf.numPages > maxPages) {
          const moreDiv = document.createElement('div');
          moreDiv.className = 'text-center text-xs text-slate-400 p-2';
          moreDiv.textContent = `... and ${pdf.numPages - maxPages} more pages`;
          container.appendChild(moreDiv);
        }
      } catch (error) {
        container.innerHTML = '<div class="p-4 text-center text-rose-400"><i class="fa-solid fa-exclamation-triangle"></i> Preview failed</div>';
      }
    }

    // Open a tool
    async function openTool(id) {
      const t = tools.find(x=>x.id===id);
      openModal(
        `<div class="h-10 w-10 rounded-xl bg-gradient-to-br ${t.gradient} border border-white/10 flex items-center justify-center">
           <i class="fa-solid ${t.icon} ${t.color} text-lg"></i>
         </div>`,
        t.name,
        t.desc
      );

      modalBody.innerHTML = '<div class="p-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin"></i> Loading tool…</div>';
      try {
        await ensureLibs();
      } catch (err) {
        modalBody.innerHTML = '<div class="p-6 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-200 text-sm">Could not load the PDF engine. Please check your internet connection and try again.</div>';
        return;
      }

      // Tool UIs + Logic using pdf-lib
      switch(id) {
        // Merge PDFs
        case 'merge': {
          modalBody.innerHTML = `
            <div class="grid lg:grid-cols-[1fr,300px] gap-4">
              <div class="rounded-xl bg-white/[0.03] border border-white/10 p-4">
                <label class="block text-sm text-slate-300 mb-2"><i class="fa-solid fa-file-arrow-up text-sky-300"></i> Select PDFs to merge</label>
                <input id="mgFiles" type="file" accept="application/pdf" multiple class="block text-sm text-slate-300 file:mr-4 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-indigo-600 file:text-white hover:file:bg-indigo-500"/>
                <p class="text-xs text-slate-500 mt-2">Select 2 or more PDF files. You can reorder them below.</p>
                <ul id="mgList" class="mt-3 divide-y divide-white/5"></ul>
                <div class="mt-4 flex items-center gap-3">
                  <button id="mgRun" disabled class="px-4 py-2 rounded-xl bg-indigo-600/50 text-white border border-white/10 cursor-not-allowed"><i class="fa-solid fa-layer-group"></i> Merge PDFs</button>
                  <button id="mgClear" class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-200"><i class="fa-solid fa-trash"></i> Clear All</button>
                </div>
              </div>
              <div class="rounded-xl bg-white/[0.03] border border-white/10 p-4">
                <h4 class="text-sm text-slate-300 mb-2"><i class="fa-regular fa-eye"></i> Live Preview</h4>
                <div id="mgPreview" class="pdf-preview text-center text-slate-500 text-sm p-4">
                  Select files to see preview
                </div>
              </div>
            </div>
            <div id="mgStatus" class="hidden mt-4 p-3 rounded-xl text-sm"></div>
            <div id="mgOut" class="mt-4"></div>`;
          
          let files=[]; let seq=0;
          const fIn = document.getElementById('mgFiles');
          const list = document.getElementById('mgList');
          const run = document.getElementById('mgRun');
          const clr = document.getElementById('mgClear');
          const stat = document.getElementById('mgStatus');
          const out = document.getElementById('mgOut');
          
          function refresh(){
            list.innerHTML='';
            files.forEach((it,i)=>{
              const li=document.createElement('li');
              li.className='flex items-center justify-between gap-3 px-3 py-2 text-sm';
              li.innerHTML = `
                <div class="flex items-center gap-3 min-w-0">
                  <span class="inline-flex items-center justify-center h-7 w-7 rounded-lg bg-white/5 border border-white/10 text-slate-300">${i+1}</span>

                if (pageNum >= 1 && pageNum <= totalPages) {

              status.classList.remove('hidden');
              
              const bytes = await readArrayBuffer(file); 
              const sourcePdf = await PDFLib.PDFDocument.load(bytes);
              const totalPages = sourcePdf.getPageCount();
              
              // Parse page range
              const pages = new Set();
              const parts = rangeStr.split(',').map(s => s.trim()).filter(Boolean);
              
              for (const part of parts) {
                if (part.includes('-')) {
                  const [start, end] = part.split('-').map(s => s.trim());
                  const startNum = parseInt(start, 10);
                  const endNum = parseInt(end, 10);
                  
                  if (startNum >= 1 && endNum <= totalPages && startNum <= endNum) {
                    for (let i = startNum; i <= endNum; i++) {
                      pages.add(i - 1); // Convert to 0-based index
                    }
                  }
                } else {
                  const pageNum = parseInt(part, 10);
                  if (pageNum >= 1 && pageNum <= totalPages) {
                    pages.add(pageNum - 1); // Convert to 0-based index
                  }
                }
              }
              
              if (pages.size === 0) {
                throw new Error('No valid pages found in the specified range');
              }
              
              const pageIndices = Array.from(pages).sort((a, b) => a - b);
              const newPdf = await PDFLib.PDFDocument.create();
              const copiedPages = await newPdf.copyPages(sourcePdf, pageIndices);
              copiedPages.forEach((page) => newPdf.addPage(page));
              
              const pdfBytes = await newPdf.save(); 
              const blob = new Blob([pdfBytes], {type: 'application/pdf'});
              
              output.appendChild(createDownload(blob, filename, `Download ${filename}`)); 
              status.textContent = `✅ Successfully extracted ${pageIndices.length} pages!`;
            }catch(err){
              status.className='mt-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-200 text-sm'; 
              status.textContent='❌ Error extracting pages: ' + err.message;
            }
          });
        } break;

        // Create Blank PDF
        case 'blank': {
          modalBody.innerHTML=`
            <div class="rounded-xl bg-white/[0.03] border border-white/10 p-4">
              <h3 class="text-lg font-semibold text-slate-200 mb-3"><i class="fa-solid fa-file-plus text-fuchsia-300"></i> Create New PDF</h3>
              <div class="grid sm:grid-cols-3 gap-3">
                <label class="block">
                  <span class="text-sm text-slate-300">Number of pages</span>
                  <input id="blPages" type="number" value="1" min="1" max="100" class="w-full mt-1 px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-slate-200"/>
                </label>
                <label class="block">
                  <span class="text-sm text-slate-300">Page size</span>
                  <select id="blSize" class="w-full mt-1 px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-slate-200">
                    <option value="a4">A4 (210 × 297 mm)</option>
                    <option value="letter">Letter (8.5 × 11 in)</option>
                    <option value="legal">Legal (8.5 × 14 in)</option>
                    <option value="a3">A3 (297 × 420 mm)</option>
                  </select>
                </label>
                <label class="block">
                  <span class="text-sm text-slate-300">Filename</span>
                  <input id="blName" value="blank.pdf" class="w-full mt-1 px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-slate-200"/>
                </label>
              </div>
              <div class="mt-4">
                <button id="blRun" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white"><i class="fa-solid fa-file-circle-plus"></i> Create PDF</button>
              </div>
            </div>
            <div id="blStatus" class="hidden mt-4 p-3 rounded-xl text-sm"></div>
            <div id="blOut" class="mt-4"></div>`;
          
          document.getElementById('blRun').addEventListener('click', async ()=>{
            const numPages = Math.max(1, Math.min(100, parseInt(document.getElementById('blPages').value || 1, 10)));
            const pageSize = document.getElementById('blSize').value;
            const filename = document.getElementById('blName').value || 'blank.pdf';
            const status = document.getElementById('blStatus'); 
            const output = document.getElementById('blOut'); 
            output.innerHTML='';
            
            try{
              status.className='mt-4 p-3 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-200 text-sm'; 
              status.textContent='Creating blank PDF using pdf-lib...'; 
              status.classList.remove('hidden');
              
              const pdfDoc = await PDFLib.PDFDocument.create();
              
              // Page size mapping
              const pageSizes = {
                a4: PDFLib.PageSizes.A4,
                letter: PDFLib.PageSizes.Letter,
                legal: PDFLib.PageSizes.Legal,
                a3: PDFLib.PageSizes.A3
              };
              
              const selectedSize = pageSizes[pageSize] || PDFLib.PageSizes.A4;
              
              // Add pages
              for (let i = 0; i < numPages; i++) {
                pdfDoc.addPage(selectedSize);
              }
              
              // Set metadata
              pdfDoc.setTitle('Blank PDF Document');
              pdfDoc.setAuthor('PDF Toolbox');
              pdfDoc.setCreationDate(new Date());
              
              const pdfBytes = await pdfDoc.save(); 
              const blob = new Blob([pdfBytes], {type: 'application/pdf'});
              
              output.appendChild(createDownload(blob, filename, `Download ${filename}`)); 
              status.textContent = `✅ Successfully created ${numPages} page${numPages > 1 ? 's' : ''} PDF!`;
            }catch(err){
              status.className='mt-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-200 text-sm'; 
              status.textContent='❌ Error creating PDF: ' + err.message;
            }
          });
        } break;

        // Add Protection (real AES-256 password encryption)
        case 'protect': {
          modalBody.innerHTML=`
            <div class="grid lg:grid-cols-[1fr,300px] gap-4">
              <div class="rounded-xl bg-white/[0.03] border border-white/10 p-4">
                <label class="block text-sm text-slate-300 mb-2"><i class="fa-solid fa-file-arrow-up text-sky-300"></i> Select a PDF</label>
                <input id="protFile" type="file" accept="application/pdf" class="block text-sm text-slate-300 file:mr-4 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-indigo-600 file:text-white hover:file:bg-indigo-500"/>
                <div class="mt-3 grid sm:grid-cols-2 gap-3">
                  <label class="block"><span class="text-sm text-slate-300">Open password (required)</span>
                    <input id="protPass" type="password" placeholder="Password to open the PDF" class="w-full mt-1 px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-slate-200"/>
                  </label>
                  <label class="block"><span class="text-sm text-slate-300">Owner password (optional)</span>
                    <input id="protOwner" type="password" placeholder="Leave empty to reuse the open password" class="w-full mt-1 px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-slate-200"/>
                  </label>
                </div>
                <div class="mt-3 grid sm:grid-cols-2 gap-3">
                  <label class="inline-flex items-center gap-2 text-sm text-slate-300">
                    <input id="protPrint" type="checkbox" checked class="h-4 w-4 rounded border-white/20 bg-white/10"> Allow printing
                  </label>
                  <label class="inline-flex items-center gap-2 text-sm text-slate-300">
                    <input id="protCopy" type="checkbox" class="h-4 w-4 rounded border-white/20 bg-white/10"> Allow copying text
                  </label>
                </div>
                <p class="text-xs text-slate-500 mt-2">AES-256 encryption, done fully in your browser. Editing, annotating and page extraction are disabled by default.</p>
                <div class="mt-3">
                  <label class="block"><span class="text-sm text-slate-300">Output filename</span>
                    <input id="protName" value="protected.pdf" class="w-full mt-1 px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-slate-200"/>
                  </label>
                </div>
                <div class="mt-4">
                  <button id="protRun" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white"><i class="fa-solid fa-lock"></i> Protect PDF</button>
                </div>
              </div>
              <div class="rounded-xl bg-white/[0.03] border border-white/10 p-4">
                <h4 class="text-sm text-slate-300 mb-2"><i class="fa-regular fa-eye"></i> Live Preview</h4>
                <div id="protPreview" class="pdf-preview text-center text-slate-500 text-sm p-4">
                  Select a PDF to see preview
                </div>
              </div>
            </div>
            <div id="protStatus" class="hidden mt-4 p-3 rounded-xl text-sm"></div>
            <div id="protOut" class="mt-4"></div>`;

          document.getElementById('protFile').addEventListener('change', e => {
            if (e.target.files[0]) renderPDFPreview(e.target.files[0], 'protPreview', 2);
          });

          document.getElementById('protRun').addEventListener('click', async ()=>{
            const file = document.getElementById('protFile').files[0];
            const userPassword = document.getElementById('protPass').value;
            const ownerPassword = document.getElementById('protOwner').value || userPassword;
            const allowPrint = document.getElementById('protPrint').checked;
            const allowCopy = document.getElementById('protCopy').checked;
            const filename = document.getElementById('protName').value || 'protected.pdf';
            const status = document.getElementById('protStatus');
            const output = document.getElementById('protOut');
            const run = document.getElementById('protRun');
            output.innerHTML='';

            if(!file){ alert('Please select a PDF file'); return; }
            if(!userPassword){ alert('Please enter a password to open the protected PDF'); return; }
            if(userPassword.length < 4){ alert('Please use a password with at least 4 characters'); return; }

            try{
              run.disabled = true;
              run.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Encrypting...';
              status.className='mt-4 p-3 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-200 text-sm';
              status.textContent='Encrypting with AES-256...'; status.classList.remove('hidden');

              const bytes = await readArrayBuffer(file);
              const pdfDoc = await PDFLib.PDFDocument.load(bytes);
              pdfDoc.encrypt({
                userPassword,
                ownerPassword,
                permissions: {
                  printing: allowPrint,
                  copying: allowCopy,
                  modifying: false,
                  annotating: false,
                  fillingForms: false,
                  contentAccessibility: true,
                  documentAssembly: false
                }
              });
              const pdfBytes = await pdfDoc.save();
              const blob = new Blob([pdfBytes], {type: 'application/pdf'});

              output.appendChild(createDownload(blob, filename, `Download ${filename}`));
              status.className='mt-4 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-200 text-sm';
              status.textContent = `✅ PDF encrypted with AES-256. Open it with the password you entered (${allowPrint ? 'printing allowed' : 'printing blocked'}, ${allowCopy ? 'copying allowed' : 'copying blocked'}).`;
            }catch(err){
              status.className='mt-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-200 text-sm';
              status.textContent='❌ Error protecting PDF: ' + friendlyPdfError(err);
            }finally{
              run.disabled = false;
              run.innerHTML = '<i class="fa-solid fa-lock"></i> Protect PDF';
            }
          });
        } break;

        // PDF Information
        case 'info': {
          modalBody.innerHTML=`
            <div class="grid lg:grid-cols-[1fr,300px] gap-4">
              <div class="rounded-xl bg-white/[0.03] border border-white/10 p-4">
                <label class="block text-sm text-slate-300 mb-2"><i class="fa-solid fa-file-arrow-up text-sky-300"></i> Select a PDF to analyze</label>
                <input id="infoFile" type="file" accept="application/pdf" class="block text-sm text-slate-300 file:mr-4 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-indigo-600 file:text-white hover:file:bg-indigo-500"/>
                <div class="mt-4">
                  <button id="infoRun" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white"><i class="fa-solid fa-circle-info"></i> Analyze PDF</button>
                </div>
                <div id="infoResults" class="mt-4 hidden">
                  <h4 class="text-sm font-semibold text-slate-300 mb-3">PDF Information</h4>
                  <div class="space-y-3 text-sm">
                    <div class="grid sm:grid-cols-2 gap-3">
                      <div class="p-3 rounded-lg bg-white/5 border border-white/10">
                        <div class="text-slate-400 text-xs">File Size</div>
                        <div id="infoSize" class="text-slate-200 font-medium">-</div>
                      </div>
                      <div class="p-3 rounded-lg bg-white/5 border border-white/10">
                        <div class="text-slate-400 text-xs">Total Pages</div>
                        <div id="infoPages" class="text-slate-200 font-medium">-</div>
                      </div>
                    </div>
                    <div class="p-3 rounded-lg bg-white/5 border border-white/10">
                      <div class="text-slate-400 text-xs">Title</div>
                      <div id="infoTitle" class="text-slate-200 font-medium">-</div>
                    </div>
                    <div class="grid sm:grid-cols-2 gap-3">
                      <div class="p-3 rounded-lg bg-white/5 border border-white/10">
                        <div class="text-slate-400 text-xs">Author</div>
                        <div id="infoAuthor" class="text-slate-200 font-medium">-</div>
                      </div>
                      <div class="p-3 rounded-lg bg-white/5 border border-white/10">
                        <div class="text-slate-400 text-xs">Creator</div>
                        <div id="infoCreator" class="text-slate-200 font-medium">-</div>
                      </div>
                    </div>
                    <div class="grid sm:grid-cols-2 gap-3">
                      <div class="p-3 rounded-lg bg-white/5 border border-white/10">
                        <div class="text-slate-400 text-xs">Creation Date</div>
                        <div id="infoCreated" class="text-slate-200 font-medium">-</div>
                      </div>
                      <div class="p-3 rounded-lg bg-white/5 border border-white/10">
                        <div class="text-slate-400 text-xs">Modified Date</div>
                        <div id="infoModified" class="text-slate-200 font-medium">-</div>
                      </div>
                    </div>
                    <div class="p-3 rounded-lg bg-white/5 border border-white/10">
                      <div class="text-slate-400 text-xs">PDF Version</div>
                      <div id="infoVersion" class="text-slate-200 font-medium">-</div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="rounded-xl bg-white/[0.03] border border-white/10 p-4">
                <h4 class="text-sm text-slate-300 mb-2"><i class="fa-regular fa-eye"></i> Live Preview</h4>
                <div id="infoPreview" class="pdf-preview text-center text-slate-500 text-sm p-4">
                  Select a PDF to see preview
                </div>
              </div>
            </div>
            <div id="infoStatus" class="hidden mt-4 p-3 rounded-xl text-sm"></div>`;
          
          document.getElementById('infoFile').addEventListener('change', e => {
            if (e.target.files[0]) {
              renderPDFPreview(e.target.files[0], 'infoPreview', 3);
            }
          });
          
          document.getElementById('infoRun').addEventListener('click', async ()=>{
            const file = document.getElementById('infoFile').files[0]; 
            const status = document.getElementById('infoStatus'); 
            const results = document.getElementById('infoResults');
            
            if(!file){ alert('Please select a PDF file'); return; }
            
            try{
              status.className='mt-4 p-3 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-200 text-sm'; 
              status.textContent='Analyzing PDF using pdf-lib...'; 
              status.classList.remove('hidden');
              
              const bytes = await readArrayBuffer(file); 
              const pdfVersion = (() => {
                const head = new TextDecoder('latin1').decode(new Uint8Array(bytes).slice(0, 8));
                const m = head.match(/%PDF-(\d\.\d)/);
                return m ? m[1] : null;
              })();
              const pdfDoc = await PDFLib.PDFDocument.load(bytes);
              
              // Extract information
              const pageCount = pdfDoc.getPageCount();
              const title = pdfDoc.getTitle() || 'Untitled';
              const author = pdfDoc.getAuthor() || 'Unknown';
              const creator = pdfDoc.getCreator() || 'Unknown';
              const creationDate = pdfDoc.getCreationDate();
              const modificationDate = pdfDoc.getModificationDate();
              
              // Update UI
              document.getElementById('infoSize').textContent = `${(file.size / 1024 / 1024).toFixed(2)} MB`;
              document.getElementById('infoPages').textContent = pageCount.toLocaleString();
              document.getElementById('infoTitle').textContent = title;
              document.getElementById('infoAuthor').textContent = author;
              document.getElementById('infoCreator').textContent = creator;
              document.getElementById('infoCreated').textContent = creationDate ? creationDate.toLocaleDateString() : 'Unknown';
              document.getElementById('infoModified').textContent = modificationDate ? modificationDate.toLocaleDateString() : 'Unknown';
              document.getElementById('infoVersion').textContent = pdfVersion ? `PDF ${pdfVersion}` : 'Unknown';
              
              results.classList.remove('hidden');
              status.textContent = `✅ Successfully analyzed PDF with ${pageCount} pages!`;
            }catch(err){
              status.className='mt-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-200 text-sm'; 
              status.textContent='❌ Error analyzing PDF: ' + err.message;
            }
          });
        } break;
      }
    }

    // Initialize the grid
    buildGrid();

    // Warm the PDF engine up after the first paint so tools open instantly.
    const warmLibs = () => ensureLibs().catch(() => {});
    if ('requestIdleCallback' in window) requestIdleCallback(warmLibs, { timeout: 2500 });
    else setTimeout(warmLibs, 1500);
  </script>

</body>
</html>
