      preset:
        endpoint: "SHAVI AI"
        model: "nvidia/nemotron-3-ultra-550b-a55b"

    - name: "shavi-vision"
      label: "SHAVI AI — Nemotron 3.5 VL"
      description: "NVIDIA Nemotron 3.5 Super VL 120B · image + document OCR, visual Q&A · images in, text out"
      iconURL: "/assets/shavi-mark.svg"
      preset:
