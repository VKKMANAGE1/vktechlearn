# SHAVI AI — LibreChat configuration
# Server-side only. Never contains API keys: they are read from env vars.
version: 1.3.19
cache: true

# Generated images come back from FLUX as JPEG; the tool and the file pipeline are
# told the same format so no image is mislabelled or re-encoded twice.
imageOutputType: "jpeg"

# Voice: LibreChat's OpenAI-compatible speech providers point at the local SHAVI Media
# gateway (:4123), which runs Piper TTS and faster-whisper ASR on this host. No cloud
# speech key is involved; if the gateway is not running these endpoints return 503 and
# the UI hides the mic/speaker (the speech block is what advertises them).
speech:
  stt:
    allowedAddresses:
      - "127.0.0.1:4123"
    openai:
      url: "http://127.0.0.1:4123/v1/audio/transcriptions"
      apiKey: "${SHAVI_MEDIA_KEY}"
      model: "whisper-small"
  tts:
    allowedAddresses:
      - "127.0.0.1:4123"
    maxInputChars: 3000
    openai:
      url: "http://127.0.0.1:4123/v1/audio/speech"
      apiKey: "${SHAVI_MEDIA_KEY}"
      model: "shavi-tts"
      voices:
        - "hi-IN-Pratham"
        - "en-US-Lessac"
  speechTab:
    speechToText:
      engineSTT: "external"
      languageSTT: "hi-IN"
      autoTranscribeAudio: true
    textToSpeech:
      engineTTS: "external"
      voice: "hi-IN-Pratham"
      languageTTS: "hi-IN"
      automaticPlayback: false
      cacheTTS: true

# Document uploads are extracted to text server-side (built-in parser: pdf, docx, doc,
# xls/xlsx, csv, pptx, odt/ods, plus native txt/json) and given to the model as context.
# Images stay on the provider (vision) path.
fileConfig:
  textFallbackWithoutTools: true
  defaultLLMDeliveryPath:
    fallback: "text"
    overrides:
      "image/*": "provider"

# Memory (M10): user-controlled facts. `personalize` injects saved memories into the
# conversation, and the background memory agent turns an explicit "remember this" into a
# stored fact. Users keep final control from Settings -> Memory (the opt-out switch) and
# from the Memory panel, where every entry can be edited or deleted.
memory:
  disabled: false
  personalize: true
  charLimit: 10000
  messageWindowSize: 5
  agent:
    enabled: true
    provider: "SHAVI AI"
    model: "nvidia/nemotron-3-ultra-550b-a55b"

# Chat Projects (M10): a project groups conversations, its own instructions and its own
# reference files, all scoped to the owner. Limits are the defaults, written out so the
# deployment's caps are explicit rather than implied.
projects:
  maxFiles: 50
  maxInstructionsLength: 16000
  maxDescriptionLength: 1000

# Web search + research: Keenable's keyless public API is the search provider and
# the page scraper. Real requests only — no cached or fabricated results.
webSearch:
  searchProvider: "keenable"
  scraperProvider: "keenable"
  rerankerType: "none"
  scraperTimeout: 25000

interface:
  customWelcome: "SHAVI AI — कोडिंग, पढ़ाई, लिखाई और रिसर्च के लिए आपका AI साथी। कुछ भी पूछें, हिंदी या English में।"
  landingFooter: true
  modelSelect: true
  privacyPolicy:
    externalUrl: "https://vktechlearn.site/privacy-policy.html"
    openNewTab: true
  termsOfService:
    externalUrl: "https://vktechlearn.site/terms-conditions.html"
    openNewTab: true

registration:
  socialLogins: []

endpoints:
  # ---------- Official provider endpoints (keys come from env) ----------
  openAI:
    titleConvo: true
    titleModel: "gpt-6-luna"
    modelDisplayLabel: "OpenAI"
    dropParams: ["user"]

  google:
    titleConvo: true
    modelDisplayLabel: "Google Gemini"

  custom:
    # NVIDIA NIM (SHAVI AI house model)
    - name: "SHAVI AI"
      apiKey: "${SHAVI_AI_KEY}"
      baseURL: "https://integrate.api.nvidia.com/v1"
      models:
        default:
          - "nvidia/nemotron-3-ultra-550b-a55b"
          # vision model: used for image uploads (file context)
          - "nvidia/nemotron-3.5-super-vl-120b-a12b"
        fetch: false
      titleConvo: true
      titleModel: "nvidia/nemotron-3-ultra-550b-a55b"
      modelDisplayLabel: "SHAVI AI"
      dropParams: ["user"]

    # DeepSeek — OpenAI-compatible official API
    - name: "DeepSeek"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "https://api.deepseek.com"
      models:
        default: ["deepseek-flash", "deepseek-v4-pro"]
        fetch: false
      titleConvo: true
      titleModel: "deepseek-flash"
      modelDisplayLabel: "DeepSeek"
      dropParams: ["user"]

# ---------- Model registry: what the selector offers ----------
modelSpecs:
  enforce: true
  prioritize: true
  list:
