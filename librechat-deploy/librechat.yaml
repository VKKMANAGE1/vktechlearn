        model: "nvidia/nemotron-3.5-super-vl-120b-a12b"

    - name: "shavi-image"
      label: "SHAVI AI — Image (FLUX)"
      description: "NVIDIA FLUX.1-dev · text-to-image · असली इमेज, कोई नकली नहीं"
      iconURL: "/assets/shavi-mark.svg"
