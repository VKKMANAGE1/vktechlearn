# SHAVI AI — Docker production deployment (M02, extended in M12)
#
#   api        LibreChat v0.8.9 (SPA + API + agents/files/streaming)
#   mongodb    Mongo 8.0 — the only stateful service that matters
#   meilisearch conversation search index
#   vectordb   pgvector for the RAG store
#   rag_api    LibreChat RAG service (document Q&A)
#   admin      shavi-admin panel + usage/cost/privacy gateway (M11)
#   caddy      HTTPS termination + reverse proxy for both hostnames (M12)
#   backup     mongodump on a schedule, retention via BACKUP_KEEP_DAYS (M12)
#
#   cp .env.example .env      # fill every CHANGE_ME (see the file header)
#   docker compose up -d --build
#   docker compose logs -f api caddy
#
# Not runnable inside the Freebuff cloud VM (docker socket is root-only). The same stack
# was verified natively there — see PROJECT_STATUS.md §M02/M11/M12. `docker compose config`
# is used in this repo as the configuration gate.

services:
  api:
    container_name: shavi-librechat
    # Built from the local LibreChat tree, not the stock registry image: the SHAVI AI branding
    # (client/src/components/BrandMark.tsx, client/public/assets/{logo,shavi-mark}.svg) and the
    # production client bundle only exist here. `docker compose up -d --build` builds it.
    build:
      context: ../librechat
      dockerfile: Dockerfile
    image: shavi-librechat:0.8.9
    restart: always
    depends_on:
      - mongodb
      - meilisearch
      - rag_api
    user: "${UID:-1000}:${GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      # M11: message limiters are off in LibreChat unless these are set.
      - LIMIT_MESSAGE_USER=${LIMIT_MESSAGE_USER:-true}
      - LIMIT_MESSAGE_IP=${LIMIT_MESSAGE_IP:-true}
      - MESSAGE_USER_MAX=${MESSAGE_USER_MAX:-40}
      - MESSAGE_USER_WINDOW=${MESSAGE_USER_WINDOW:-1}
      - MESSAGE_IP_MAX=${MESSAGE_IP_MAX:-60}
      - MESSAGE_IP_WINDOW=${MESSAGE_IP_WINDOW:-1}
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - librechat-data:/app/data
    # The API is only reachable through caddy; publish a port here only for local debugging:
    # ports: ["3080:3080"]

  admin:
    container_name: shavi-admin
    build:
      context: ../shavi-admin
    restart: always
    depends_on:
      - api
      - mongodb
    environment:
      - SHAVI_ADMIN_PORT=4127
      - SHAVI_LIBRECHAT_URL=http://api:${PORT:-3080}
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - LIMIT_MESSAGE_USER=${LIMIT_MESSAGE_USER:-true}
      - LIMIT_MESSAGE_IP=${LIMIT_MESSAGE_IP:-true}
      - MESSAGE_USER_MAX=${MESSAGE_USER_MAX:-40}
      - MESSAGE_USER_WINDOW=${MESSAGE_USER_WINDOW:-1}
      - MESSAGE_IP_MAX=${MESSAGE_IP_MAX:-60}
      - MESSAGE_IP_WINDOW=${MESSAGE_IP_WINDOW:-1}
    # Reachable through caddy at ${SHAVI_ADMIN_DOMAIN} only.

  youtube:
    container_name: shavi-youtube
    # The eleven youtube-agent-skill skills (MIT) + their six Python tools (M13).
    build:
      context: ../shavi-youtube
    restart: always
    environment:
      - SHAVI_AI_KEY=${SHAVI_AI_KEY}
      - SHAVI_YOUTUBE_PORT=4128
      - SHAVI_YOUTUBE_MODEL=${SHAVI_YOUTUBE_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
    volumes:
      # Your voice profile stays on the host, so editing it does not need a rebuild.
      - ./youtube-voice.md:/app/voice.md
    # Reachable through caddy at ${SHAVI_YOUTUBE_DOMAIN} (basic auth) only.

  caddy:
    container_name: shavi-caddy
    image: docker.io/library/caddy:2.10-alpine
    restart: always
    depends_on:
      - api
      - admin
      - youtube
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - SHAVI_DOMAIN=${SHAVI_DOMAIN:?set SHAVI_DOMAIN in .env}
      - SHAVI_ADMIN_DOMAIN=${SHAVI_ADMIN_DOMAIN:?set SHAVI_ADMIN_DOMAIN in .env}
      - SHAVI_YOUTUBE_DOMAIN=${SHAVI_YOUTUBE_DOMAIN:?set SHAVI_YOUTUBE_DOMAIN in .env}
      - SHAVI_YOUTUBE_USER=${SHAVI_YOUTUBE_USER:?set SHAVI_YOUTUBE_USER in .env}
      - SHAVI_YOUTUBE_HASH=${SHAVI_YOUTUBE_HASH:?set SHAVI_YOUTUBE_HASH in .env}
      - ACME_EMAIL=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - PORT=${PORT:-3080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  mongodb:
    container_name: shavi-mongodb
    image: docker.io/library/mongo:8.0.20
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5

  backup:
    container_name: shavi-backup
    image: docker.io/library/mongo:8.0.20
    restart: always
    depends_on:
      - mongodb
    environment:
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        while true; do
          ts=$$(date -u +%Y-%m-%dT%H-%M-%S)
          echo "[backup] $$ts starting"
          mongodump --uri="mongodb://mongodb:27017/LibreChat" --gzip --archive="/backups/librechat-$$ts.gz"
          find /backups -name 'librechat-*.gz' -mtime +$${BACKUP_KEEP_DAYS} -delete
          echo "[backup] done; sleeping $${BACKUP_INTERVAL_HOURS}h"
          sleep $$(( $${BACKUP_INTERVAL_HOURS} * 3600 ))
        done

  meilisearch:
    container_name: shavi-meilisearch
    image: docker.io/getmeili/meilisearch:v1.35.1
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ./meili_data_v1.35.1:/meili_data

  vectordb:
    container_name: shavi-vectordb
    image: docker.io/pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-mypassword}
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data

  rag_api:
    container_name: shavi-rag_api
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite:latest
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env

volumes:
  pgdata:
  librechat-data:
  caddy_data:
  caddy_config:
